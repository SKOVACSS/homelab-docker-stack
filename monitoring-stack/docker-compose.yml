# Monitoring Stack - Advanced System Metrics & Dashboards
# Collects: CPU, Memory, Disk, Network, Docker stats
# Displays: InfluxDB time-series data in Grafana
# Replaces: External monitoring services

# monitoring-network is owned here and joined externally by utilities'
# Grafana (see utilities/docker-compose.yml) so one Grafana instance can
# show Prometheus/Loki AND InfluxDB data - see TROUBLESHOOTING.md for the
# deployment-order consequence of that (this stack must come up before
# utilities, which the _scripts/deploy.ps1 order already does).
networks:
  monitoring-network:
    driver: bridge
    name: monitoring-network

services:
  # ========== INFLUXDB: Time-Series Database ==========
  influxdb:
    image: influxdb:2-alpine
    restart: unless-stopped
    container_name: influxdb
    # No published port: no Caddy route, and its only consumers (Telegraf,
    # Grafana) already reach it over monitoring-network. A security audit
    # found it published to the host anyway. If you want direct `influx`
    # CLI/API access from the host for debugging, add back
    # `ports: ["8086:8086"]` here.
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      # INFLUXDB_DB / INFLUXDB_ADMIN_USER / INFLUXDB_HTTP_AUTH_ENABLED are
      # InfluxDB 1.x setup variables and do nothing on this 2.x image - its
      # first-run setup uses the DOCKER_INFLUXDB_INIT_* variables instead.
      # Org/bucket names match what's hardcoded in telegraf.conf.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=homelab
      - DOCKER_INFLUXDB_INIT_BUCKET=homelab
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  # ========== TELEGRAF: Metrics Collection ==========
  telegraf:
    image: telegraf:1.40.0
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: telegraf
    # The image's default user (uid 999, non-root) can't read the bind-
    # mounted docker.sock - confirmed live, it fails with "permission
    # denied" and crash-loops. `user: root` alone doesn't fix it either:
    # the image's own /entrypoint.sh unconditionally drops from root to
    # the telegraf user via setpriv before launching, and deliberately
    # strips the "root" group (which is what actually owns the socket on
    # Docker Desktop) from the groups it's allowed to keep - see
    # https://github.com/influxdata/influxdata-docker/issues/724. A
    # host-specific docker-group GID (group_add) would work on native
    # Linux but isn't portable across Windows/Synology, which this repo
    # needs to run on. Bypassing that entrypoint script entirely and
    # running telegraf directly as root is the portable fix.
    user: root
    entrypoint: ["/usr/bin/telegraf"]
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    environment:
      # telegraf.conf's [[outputs.influxdb_v2]] reads TELEGRAF_TOKEN directly
      # from the container environment (Telegraf does its own config-file
      # variable substitution) - it needs the v2 API token, not the admin password.
      - TELEGRAF_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      - influxdb
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "telegraf", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Grafana lives in utilities/docker-compose.yml (one instance for
  # Prometheus/Loki/InfluxDB, not a separate one per data source - see
  # CHANGELOG.md). It reaches InfluxDB by joining monitoring-network
  # externally, and reads INFLUXDB_ADMIN_TOKEN from utilities/.env (must
  # match the value here).

volumes:
  influxdb-data:
    driver: local
  influxdb-config:
    driver: local
