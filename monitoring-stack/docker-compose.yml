# Monitoring Stack - Advanced System Metrics & Dashboards
# Collects: CPU, Memory, Disk, Network, Docker stats
# Displays: InfluxDB time-series data in Grafana
# Replaces: External monitoring services

networks:
  monitoring-network:
    driver: bridge
    name: monitoring-network
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true

services:
  # ========== INFLUXDB: Time-Series Database ==========
  influxdb:
    image: influxdb:2-alpine
    restart: unless-stopped
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      # INFLUXDB_DB / INFLUXDB_ADMIN_USER / INFLUXDB_HTTP_AUTH_ENABLED are
      # InfluxDB 1.x setup variables and do nothing on this 2.x image - its
      # first-run setup uses the DOCKER_INFLUXDB_INIT_* variables instead.
      # Org/bucket names match what's hardcoded in telegraf.conf.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=homelab
      - DOCKER_INFLUXDB_INIT_BUCKET=homelab
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  # ========== TELEGRAF: Metrics Collection ==========
  telegraf:
    image: telegraf:1.38.1
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: telegraf
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    environment:
      # telegraf.conf's [[outputs.influxdb_v2]] reads TELEGRAF_TOKEN directly
      # from the container environment (Telegraf does its own config-file
      # variable substitution) - it needs the v2 API token, not the admin password.
      - TELEGRAF_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      - influxdb
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "telegraf", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ========== GRAFANA: Visualization & Dashboards ==========
  grafana-advanced:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: grafana-advanced
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      # Bind mount (not a named volume) so the datasource/dashboard files in
      # this repo are actually loaded - see ./grafana-provisioning/.
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=https://metrics.${DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Read by grafana-provisioning/datasources/datasources.yml
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    depends_on:
      - influxdb
    networks:
      - monitoring-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

volumes:
  influxdb-data:
    driver: local
  influxdb-config:
    driver: local
  grafana-storage:
    driver: local
