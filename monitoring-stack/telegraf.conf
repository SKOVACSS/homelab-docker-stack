# Telegraf Configuration - Advanced Metrics Collection
# Collects: CPU, Memory, Disk, Network, Docker, Process stats

[global_tags]
  environment = "homelab"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "30s"
  flush_jitter = "5s"
  precision = ""
  debug = false
  quiet = false
  omit_hostname = false

# ============================================================================
# OUTPUT PLUGINS
# ============================================================================

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${TELEGRAF_TOKEN}"
  organization = "homelab"
  bucket = "homelab"
  
# ============================================================================
# INPUT PLUGINS - SYSTEM METRICS
# ============================================================================

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  # Without this, there's no single "overall usage" field - the Grafana
  # dashboard (grafana-dashboard-system.json) queries usage_active.
  report_active = true

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660"]
  mount_points = ["/"]
  paths = ["/"]
  tagexclude = ["mode"]

[[inputs.diskio]]
  devices = ["*"]
  skip_serial_number = true

[[inputs.mem]]

[[inputs.net]]
  interfaces = ["*"]

[[inputs.netstat]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

# ============================================================================
# INPUT PLUGINS - DOCKER METRICS
# ============================================================================

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = []
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice = true
  total = true
  docker_label_include = []
  docker_label_exclude = []

# ============================================================================
# INPUT PLUGINS - PROCESS MONITORING
# ============================================================================

[[inputs.processes]]

[[inputs.procstat]]
  pattern = "docker"
  prefix = "docker_process_"

[[inputs.procstat]]
  pattern = "caddy"
  prefix = "caddy_process_"

[[inputs.procstat]]
  pattern = "sonarr"
  prefix = "sonarr_process_"

# ============================================================================
# INPUT PLUGINS - INFLUXDB MONITORING
# ============================================================================

[[inputs.influxdb]]
  urls = ["http://influxdb:8086"]
  
# ============================================================================
# INPUT PLUGINS - FILE MONITORING
# ============================================================================

[[inputs.filecount]]
  directories = ["/var/lib/docker/volumes", "/backups"]
  name = "filecount"

[[inputs.file]]
  files = ["/proc/cpuinfo", "/proc/meminfo"]
  from_beginning = true
  tag_files = true

# ============================================================================
# PROCESSOR PLUGINS - DATA FILTERING & AGGREGATION
# ============================================================================

[[processors.rename]]
  [[processors.rename.replace]]
    field = "usage_percent"
    dest = "percent"

[[processors.regex]]
  [[processors.regex.tags]]
    key = "host"
    pattern = "^(.*?)\\..*"
    replacement = "${1}"

# ============================================================================
# AGGREGATOR PLUGINS
# ============================================================================

[[aggregators.minmax]]
  period = "60s"
  drop_original = false
