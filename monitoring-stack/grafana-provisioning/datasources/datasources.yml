apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb-v2
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: homelab
      defaultBucket: homelab
      httpMode: POST
    secureJsonData:
      token: ${INFLUXDB_ADMIN_TOKEN}
    editable: false
