# Authentik blueprint - one Authentik login in front of every admin-only
# web app (the *arrs, qBittorrent, slskd, Syncthing, Uptime Kuma, Pi-hole,
# Homepage...). Caddy asks Authentik's embedded outpost before letting a
# request through (the `authentik` snippet in caddy/Caddyfile); only members
# of "authentik Admins" pass. Each app keeps its own login behind this.
#
# Domain-level mode: signing in once covers every subdomain (the session
# cookie is set on DOMAIN itself), so it's one login for all of them, not
# one per app. Each site's API paths skip this in Caddy - they're already
# protected by the app's API key, and Homepage widgets, Seerr and phone
# apps (nzb360, LunaSea...) can't do a browser login.
version: 1
metadata:
  name: Homelab - Admin apps forward auth
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: admin-apps-provider
    identifiers:
      name: Admin apps
    attrs:
      name: Admin apps
      mode: forward_domain
      external_host: !Format ["https://auth.%s", !Env DOMAIN]
      cookie_domain: !Env DOMAIN
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # How long one sign-in lasts across all admin apps.
      access_token_validity: hours=24
  - model: authentik_core.application
    id: admin-apps-app
    identifiers:
      slug: admin-apps
    attrs:
      name: Admin apps
      slug: admin-apps
      provider: !KeyOf admin-apps-provider
      meta_launch_url: !Format ["https://dash.%s/", !Env DOMAIN]
      meta_description: The *arrs, downloads, monitoring and the dashboard
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf admin-apps-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
  # Household exception: Stirling-PDF (pdf.DOMAIN, family-stack) has no
  # login of its own, so it uses the same Caddy wall - but with its own
  # single-site provider and no group binding, so any Authentik user gets
  # in. The outpost matches a request's exact host before falling back to
  # the domain-level provider above.
  - model: authentik_providers_proxy.proxyprovider
    id: pdf-tools-provider
    identifiers:
      name: PDF tools
    attrs:
      name: PDF tools
      mode: forward_single
      external_host: !Format ["https://pdf.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=24
  - model: authentik_core.application
    identifiers:
      slug: pdf-tools
    attrs:
      name: PDF tools
      slug: pdf-tools
      provider: !KeyOf pdf-tools-provider
      meta_launch_url: !Format ["https://pdf.%s/", !Env DOMAIN]
      meta_description: Merge, sign, compress and convert PDFs
      policy_engine_mode: any
  # Same household wall for SearXNG (search.DOMAIN) and PairDrop
  # (drop.DOMAIN), which have no logins of their own either.
  - model: authentik_providers_proxy.proxyprovider
    id: search-provider
    identifiers:
      name: Search
    attrs:
      name: Search
      mode: forward_single
      external_host: !Format ["https://search.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=24
  - model: authentik_core.application
    identifiers:
      slug: search
    attrs:
      name: Search
      slug: search
      provider: !KeyOf search-provider
      meta_launch_url: !Format ["https://search.%s/", !Env DOMAIN]
      meta_description: Private web search
      policy_engine_mode: any
  - model: authentik_providers_proxy.proxyprovider
    id: file-drop-provider
    identifiers:
      name: File drop
    attrs:
      name: File drop
      mode: forward_single
      external_host: !Format ["https://drop.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=24
  - model: authentik_core.application
    identifiers:
      slug: file-drop
    attrs:
      name: File drop
      slug: file-drop
      provider: !KeyOf file-drop-provider
      meta_launch_url: !Format ["https://drop.%s/", !Env DOMAIN]
      meta_description: Send files between phones and computers
      policy_engine_mode: any
  # The embedded outpost (inside authentik-server) answers Caddy's checks;
  # it only serves providers listed here.
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf admin-apps-provider
        - !KeyOf pdf-tools-provider
        - !KeyOf search-provider
        - !KeyOf file-drop-provider
