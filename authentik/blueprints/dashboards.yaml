# Authentik blueprint - logins for the two Homepage dashboards
# (dashboard/docker-compose.yml):
#   dash.DOMAIN - admin dashboard. Its provider/application ("Homepage",
#                 slug "homepage") were first created by hand; this takes
#                 them over: new address, admins only.
#   home.DOMAIN - family dashboard ("Home", slug "home"), any Authentik user.
version: 1
metadata:
  name: Homelab - Dashboards
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ---------- Admin dashboard (existing objects, updated) ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: admin-dash-provider
    identifiers:
      name: Homepage
    attrs:
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://dash.%s/api/auth/callback/homepage-oidc", !Env DOMAIN]
  - model: authentik_core.application
    id: admin-dash-app
    identifiers:
      slug: homepage
    attrs:
      name: Admin dashboard
      meta_launch_url: !Format ["https://dash.%s/", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf admin-dash-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30

  # ---------- Family dashboard ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: home-provider
    identifiers:
      name: Home
    attrs:
      name: Home
      client_type: confidential
      client_id: homepage-family
      client_secret: !Env HOMEPAGE_FAMILY_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://home.%s/api/auth/callback/homepage-oidc", !Env DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: home
    attrs:
      name: Home
      slug: home
      provider: !KeyOf home-provider
      meta_launch_url: !Format ["https://home.%s/", !Env DOMAIN]
      meta_description: All the family's apps in one place
      policy_engine_mode: any
