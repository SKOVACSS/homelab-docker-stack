# Authentik blueprint - login for remote-stack's Guacamole (browser remote
# desktop into the server). Applied automatically by authentik-worker; see
# grafana.yaml for how blueprints are loaded.
#
# Only members of "authentik Admins" may sign in at all (policy binding
# below) - everyone else is refused by Authentik before Guacamole is
# involved. Guacamole's OpenID support uses the implicit flow (the token
# comes back to the browser, no client secret), hence a public client.
version: 1
metadata:
  name: Homelab - Remote Desktop OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: remote-desktop-provider
    identifiers:
      name: Remote Desktop
    attrs:
      name: Remote Desktop
      client_type: public
      client_id: guacamole
      # Authentik only allows the grant types listed here; the implicit
      # flow is off unless named (seen live: "Invalid grant_type").
      grant_types:
        - implicit
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Short sessions: this is the front door to the whole server.
      access_code_validity: minutes=1
      access_token_validity: minutes=15
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://remote.%s/", !Env DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: remote-desktop-app
    identifiers:
      slug: remote-desktop
    attrs:
      name: Remote Desktop
      slug: remote-desktop
      provider: !KeyOf remote-desktop-provider
      meta_launch_url: !Format ["https://remote.%s/", !Env DOMAIN]
      meta_description: The server's Windows desktop in the browser
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf remote-desktop-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
