# Authentik blueprint - sign-in for family-stack's apps (Audiobookshelf,
# Mealie, Actual Budget). Same pattern as app-logins.yaml. Any Authentik
# user may sign in; each app decides what they can see. Stirling-PDF has
# no login of its own and uses the forward-auth wall instead (see
# admin-apps.yaml, "PDF tools").
version: 1
metadata:
  name: Homelab - Family apps (OIDC)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ---------- Audiobookshelf ----------
  # Its OIDC settings live in its own database: Settings -> Authentication
  # -> OpenID Connect (issuer https://auth.DOMAIN/application/o/
  # audiobookshelf/, client "audiobookshelf", secret from family-stack/.env).
  - model: authentik_providers_oauth2.oauth2provider
    id: audiobookshelf-provider
    identifiers:
      name: Audiobookshelf
    attrs:
      name: Audiobookshelf
      client_type: confidential
      client_id: audiobookshelf
      client_secret: !Env AUDIOBOOKSHELF_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://audiobooks.%s/auth/openid/callback", !Env DOMAIN]
        - matching_mode: strict
          url: !Format ["https://audiobooks.%s/auth/openid/mobile-redirect", !Env DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: audiobookshelf
    attrs:
      name: Audiobooks
      slug: audiobookshelf
      provider: !KeyOf audiobookshelf-provider
      meta_launch_url: !Format ["https://audiobooks.%s/", !Env DOMAIN]
      meta_description: Audiobooks & podcasts
      policy_engine_mode: any

  # ---------- Mealie ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: mealie-provider
    identifiers:
      name: Mealie
    attrs:
      name: Mealie
      client_type: confidential
      client_id: mealie
      client_secret: !Env MEALIE_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://recipes.%s/login", !Env DOMAIN]
        - matching_mode: strict
          url: !Format ["https://recipes.%s/login?direct=1", !Env DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: mealie
    attrs:
      name: Recipes
      slug: mealie
      provider: !KeyOf mealie-provider
      meta_launch_url: !Format ["https://recipes.%s/", !Env DOMAIN]
      meta_description: Recipes, meal plans & shopping lists
      policy_engine_mode: any

  # ---------- Actual Budget ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: actual-provider
    identifiers:
      name: Actual Budget
    attrs:
      name: Actual Budget
      client_type: confidential
      client_id: actual
      client_secret: !Env ACTUAL_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://budget.%s/openid/callback", !Env DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: actual
    attrs:
      name: Budget
      slug: actual
      provider: !KeyOf actual-provider
      meta_launch_url: !Format ["https://budget.%s/", !Env DOMAIN]
      meta_description: Household budget
      policy_engine_mode: any
