# Authentik blueprint - applied automatically by authentik-worker from
# /blueprints/custom (see ../docker-compose.yml), and re-applied whenever
# this file changes, so a fresh install gets the Grafana login without any
# clicking. Secret and domain come from the worker's environment
# (GRAFANA_OIDC_CLIENT_SECRET, DOMAIN in authentik/.env) - never this file.
# Grafana's side is in utilities/docker-compose.yml (GF_AUTH_GENERIC_OAUTH_*).
version: 1
metadata:
  name: Homelab - Grafana OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: Grafana
    attrs:
      name: Grafana
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      # Authentik only allows the grant types listed here (an empty list
      # refuses every login - seen live: "Invalid grant_type").
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://grafana.%s/login/generic_oauth", !Env DOMAIN]
      # openid/email/profile scopes - profile carries the "groups" claim
      # Grafana maps to roles (authentik Admins -> Grafana Admin).
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
  - model: authentik_core.application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      slug: grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: !Format ["https://grafana.%s/", !Env DOMAIN]
      meta_description: Metrics, logs and alerts
      policy_engine_mode: any
