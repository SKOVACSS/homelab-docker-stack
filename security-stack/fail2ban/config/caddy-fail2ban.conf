# Fail2Ban Caddy jail configuration
# Protects against brute force attacks on authentication endpoints

[DEFAULT]
bantime = 3600
findtime = 600
maxretry = 5
destemail = admin@localhost
sendername = Fail2Ban

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> .* "POST /auth/login HTTP/1.1" 401
            ^<HOST> .* "POST /api/v1/auth HTTP/1.1" 401
            ^<HOST> .* "POST /vault/identity/connect/token HTTP/1.1" 401
            ^<HOST> .* "POST /login HTTP/1.1" 401
            ^<HOST> .* "POST /admin/login HTTP/1.1" 401

ignoreregex =

# Detection of username enumeration
failregex2 = ^<HOST> .* "GET /auth/user HTTP/1.1" 401
maxretry2 = 10

# Detection of API brute force
failregex3 = ^<HOST> .* "POST /api.* HTTP/1.1" 401
maxretry3 = 20

action = %(action_mwl)s
