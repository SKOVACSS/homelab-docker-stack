# Filter definition only - failregex/datepattern/ignoreregex. Bantime,
# findtime, maxretry, chain, logpath, and action all belong in the JAIL
# definition (jail.d/caddy.local), not here - the previous version of
# this repo's fail2ban config mixed the two together in one file sitting
# in the wrong directory entirely (/etc/fail2ban/jail.d instead of this
# image's actual custom-filter convention, /data/filter.d - see
# https://github.com/crazy-max/docker-fail2ban#custom-jails-actions-and-filters).
# That meant it was never active: not a real jail, not a real filter,
# just an orphaned file Fail2Ban never loaded as either.
#
# Matches Caddy's real JSON access log (caddy/Caddyfile's global `log`
# option + per-site `log` directives). Confirmed live against real log
# lines - uses "client_ip", not "remote_ip": with `trusted_proxies` now
# configured in the Caddyfile, `client_ip` is the real visitor's IP
# (extracted from Cloudflare's forwarded headers via the tunnel), while
# `remote_ip` is always cloudflared's own container IP for every
# tunnel-routed request - matching on remote_ip would ban cloudflared,
# taking the whole site down for everyone rather than the actual
# attacker.
#
# Deliberately generic (any 401/403, any host, any path) rather than
# hardcoded to guessed login paths per app - Sonarr/Radarr/Prowlarr/
# Lidarr/qBittorrent/Authentik/Vaultwarden/etc. each have their own login
# endpoint at a different path, and a repeated 401/403 from the same real
# client IP anywhere behind this proxy is suspicious regardless of which
# app it's aimed at.

[Definition]
# Caddy's "ts" field is a raw Unix epoch float ("ts":1790100139.034...),
# not a human-readable date - without this, Fail2Ban's auto-detection may
# not reliably find it, which breaks findtime/bantime windowing even if
# failregex itself matches correctly.
datepattern = "ts":%%f

failregex = ^.*"client_ip":"<HOST>".*"status":401\b
            ^.*"client_ip":"<HOST>".*"status":403\b

ignoreregex =
