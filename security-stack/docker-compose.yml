# Security Stack - Fail2Ban + VPN Server
# Fail2Ban: Monitor logs and ban repeated failed attempts
# WireGuard: VPN server for direct secure access

networks:
  security-network:
    driver: bridge
    name: security-network
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true

services:
  # ========== FAIL2BAN: Brute Force Protection ==========
  fail2ban:
    image: crazymax/fail2ban:1.1.1
    restart: unless-stopped
    container_name: fail2ban
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      # Custom jails/filters/actions go under /data/jail.d, /data/filter.d,
      # /data/action.d - this image's own documented convention (see
      # github.com/crazy-max/docker-fail2ban#custom-jails-actions-and-filters),
      # not the plain /etc/fail2ban/jail.d this repo used before, which
      # this image never actually reads custom files from.
      - ./fail2ban/data:/data
      - caddy_caddy-data:/caddy-logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    environment:
      - TZ=UTC
      - F2B_LOG_LEVEL=INFO
      - F2B_LOG_TARGET=/proc/self/fd/1
      - F2B_DBPURGEAGE=1d
    networks:
      - security-network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "fail2ban-client", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ========== WIREGUARD: VPN Server ==========
  wireguard:
    image: linuxserver/wireguard:1.0.20260223-r0-ls122
    restart: unless-stopped
    container_name: wireguard
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SERVERURL=${WIREGUARD_DOMAIN}
      - SERVERPORT=51820
      - PEERS=3
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
      - PERSISTENTKEEPALIVE_PEERS=25
      - LOG_CONFS=true
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    networks:
      - security-network
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    healthcheck:
      # Not /config/wg0.conf: this image actually writes it to
      # /config/wg_confs/wg0.conf (confirmed live) - the old path never
      # existed, so this reported "unhealthy" forever regardless of
      # WireGuard actually working.
      test: ["CMD", "test", "-f", "/config/wg_confs/wg0.conf"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  fail2ban-data:
    driver: local
  # Caddy's own access-log volume, shared in read-only so Fail2Ban's
  # caddy jail (fail2ban/data/jail.d/caddy.local) can read it directly -
  # see that file for why this is used instead of the more common
  # /var/lib/docker/containers approach. Referenced by its actual live
  # name (`docker volume ls`), which docker compose auto-generates as
  # <project-name>_<volume-name> since caddy/docker-compose.yml doesn't
  # pin an explicit `name:` for it - do not rename this without also
  # updating (or explicitly naming) the volume in caddy/docker-compose.yml,
  # or compose will create a new empty volume instead of finding it.
  caddy_caddy-data:
    external: true
