# Notification Stack - Alert System for Your Home Lab
# Services: Gotify (push notifications)
# Sends: Backup alerts, health check failures, security events

networks:
  notification-network:
    driver: bridge
    name: notification-network
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true

services:
  # ========== GOTIFY: Push Notification Server ==========
  gotify:
    image: gotify/server:3.1.1
    restart: unless-stopped
    labels:
      # Auto-updates like everything else. Gotify is small, mature,
      # single-binary software with a conservative release history (no
      # pattern of breaking changes) - the realistic failure risk here is
      # low, a deliberate call made explicitly aware that this is also the
      # channel every other alert in this stack depends on.
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: gotify
    # No published host port: reachable through Caddy at gotify.{$DOMAIN}
    # (see caddy/Caddyfile), same as every other admin UI in this repo -
    # a mobile Gotify app should point at that URL, not a host:port.
    volumes:
      - gotify-data:/app/data
    environment:
      # GOTIFY_DEFAULTUSER_USER is not a real Gotify config key (silently
      # ignored) - confirmed live that the actual login name only ever
      # comes from GOTIFY_DEFAULTUSER_NAME, which was hardcoded to
      # "Administrator" here regardless of GOTIFY_ADMIN_USER's value. The
      # password was always correct; only the username the credentials
      # export told you to use ("admin") never actually matched what
      # Gotify created. Both env vars only apply on first-ever startup
      # against an empty database anyway - changing this doesn't rename
      # an already-created account (fix that via the API, POST
      # /user/{id} with a new "name", or the web UI's user settings).
      - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_ADMIN_USER}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_ADMIN_PASSWORD}
      - GOTIFY_SERVER_SSL_ENABLED=false
      - GOTIFY_SERVER_CORS_ALLOW_ORIGINS=*
    networks:
      - notification-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  gotify-data:
    driver: local
