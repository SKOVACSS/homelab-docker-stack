# Privacy Stack - Open-Source Alternatives to Corporate Services
# Replace: Spotify, Google Drive, Dropbox, Evernote, Pocket, OneNote, Asana, Google Photos
# Plus: Paperless-ngx, Trilium, Focalboard

networks:
  privacy-network:
    driver: bridge
    name: privacy-network
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true

services:
  # ========== MUSIC STREAMING (Replace Spotify) ==========
  navidrome:
    image: deluan/navidrome:0.64.0
    restart: unless-stopped
    container_name: navidrome
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No published port: reachable only via Caddy's music.{$DOMAIN} route.
    # Navidrome has its own real per-user login (unlike several other
    # services below), but a direct LAN-reachable copy bypassing Caddy's
    # TLS/rate-limiting/headers still served no purpose - see
    # TROUBLESHOOTING.md.
    volumes:
      - navidrome-config:/data
      - ${MEDIA_MUSIC}:/music:ro
    environment:
      - ND_LOGLEVEL=info
      - ND_BASEURL=https://music.${DOMAIN}
      - ND_ENABLEGRAVATAR=false
      - ND_ENABLEEXTERNALSERVICES=false
      - ND_ENABLESTARRATING=true
      - ND_ENABLEUSERRATING=true
      - ND_DEFAULTUSERPREFERENCES={"theme":"Dark"}
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4533/rest/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  # ========== FILE SYNC (Replace Dropbox/Google Drive) ==========
  # A brand new named volume is always created owned by root, but this
  # image's entrypoint only chowns its own $HOME (not a separately
  # mounted subdirectory like config below) before dropping to PUID/PGID
  # (1000:1000 by default) - so on a fresh volume, syncthing crash-loops
  # forever on "chmod: operation not permitted" / "permission denied"
  # opening its lock file, confirmed live. This one-shot container fixes
  # ownership before syncthing ever starts, so a fresh deploy just works.
  syncthing-permissions-fix:
    image: alpine:3.22
    container_name: syncthing-permissions-fix
    command: chown -R 1000:1000 /var/syncthing/config
    volumes:
      - syncthing-config:/var/syncthing/config
    restart: "no"

  syncthing:
    image: syncthing/syncthing:2.1.5
    restart: unless-stopped
    container_name: syncthing
    depends_on:
      syncthing-permissions-fix:
        condition: service_completed_successfully
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      # Web UI (8384) deliberately NOT published - reachable only via
      # Caddy's sync.{$DOMAIN} route. The other two stay published: they're
      # Syncthing's actual sync protocol and LAN peer discovery, not an
      # admin UI - unlike a web UI, Caddy can't proxy these (not HTTP).
      - "22000:22000"      # Sync protocol
      - "21027:21027/udp"  # Discovery
    volumes:
      - syncthing-config:/var/syncthing/config
      - ${SYNC_FOLDER}:/var/syncthing/sync
    environment:
      - STNODEFAMILY=ipv4
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8384"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ========== ALL-IN-ONE (Replace Google: Drive, Calendar, Contacts, Notes) ==========
  nextcloud:
    image: nextcloud:35.0.0
    restart: unless-stopped
    container_name: nextcloud
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No published port - reachable only via Caddy's nextcloud.{$DOMAIN}
    # route. See the navidrome comment above for why.
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-config:/var/www/html/config
      - ${NEXTCLOUD_DATA}:/var/www/html/data
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${DOMAIN}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=nextcloud.${DOMAIN}
      - OVERWRITEWEBROOT=/
      - TRUSTED_PROXIES=caddy
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=nextcloud-db
    depends_on:
      - nextcloud-db
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G

  # ========== NEXTCLOUD DATABASE ==========
  nextcloud-db:
    image: mariadb:11.4.13
    restart: unless-stopped
    container_name: nextcloud-db
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - nextcloud-db:/var/lib/mysql
    environment:
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASS}
      - MYSQL_INITDB_SKIP_TZINFO=1
    networks:
      - privacy-network
    healthcheck:
      # Not mysqladmin: this MariaDB image doesn't ship it (renamed/removed
      # upstream) - confirmed live ("executable file not found in $PATH"),
      # which silently made this healthcheck report "unhealthy" forever
      # regardless of the database actually working. healthcheck.sh is the
      # image's own bundled, documented replacement.
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ========== DOCUMENT SCANNING (Replace Evernote) ==========
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1
    restart: unless-stopped
    container_name: paperless-ngx
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No published port - reachable only via Caddy's papers.{$DOMAIN}
    # route. See the navidrome comment above for why.
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - ${PAPERLESS_CONSUME}:/usr/src/paperless/consume
    environment:
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      # Missing this caused "CSRF verification failed" on every login
      # attempt - confirmed live. Paperless (Django) derives its
      # CSRF_TRUSTED_ORIGINS/ALLOWED_HOSTS from this, and without it,
      # Django doesn't trust POSTs arriving via Caddy's reverse proxy on
      # this domain even though the login page itself loads fine.
      - PAPERLESS_URL=https://papers.${DOMAIN}
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASS}
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_TASK_WORKERS=2
      - PAPERLESS_THREADS_PER_WORKER=1
      - PAPERLESS_TIME_ZONE=UTC
      - PAPERLESS_DISABLE_LOGIN=false
      - PAPERLESS_ENABLE_COMPRESSION=true
      - PAPERLESS_ENABLE_NGRAM_SEARCH=true
    depends_on:
      - paperless-db
      - paperless-redis
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ========== PAPERLESS DATABASE ==========
  paperless-db:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: paperless-db
    labels:
      # Floating minor tag - Watchtower applies patch/minor updates only
      # (a major bump still needs the tag changed by hand).
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - paperless-postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${PAPERLESS_DB_PASS}
      - POSTGRES_USER=paperless
      - POSTGRES_DB=paperless
    networks:
      - privacy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ========== PAPERLESS REDIS CACHE ==========
  paperless-redis:
    image: redis:8-alpine
    restart: unless-stopped
    container_name: paperless-redis
    labels:
      # Floating minor tag - Watchtower applies patch/minor updates only
      # (a major bump still needs the tag changed by hand).
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - paperless-redis:/data
    networks:
      - privacy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ========== READ-LATER SERVICE (Replace Pocket) ==========
  wallabag:
    image: wallabag/wallabag:2.6.14
    restart: unless-stopped
    container_name: wallabag
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No published port - reachable only via Caddy's read.{$DOMAIN} route.
    # See the navidrome comment above for why (and SECURITY.md/SETUP.md
    # for Wallabag's default-login issue, which this is unrelated to).
    volumes:
      - wallabag-data:/var/www/wallabag/web/uploads
      # Deliberately NOT a persistent volume: wallabag's own entrypoint
      # unconditionally runs `rm -f -r /var/www/wallabag/var/cache` on
      # every single startup regardless, so persisting it across restarts
      # has no benefit - and actively breaks startup, since `rm` can't
      # remove a directory that's itself a volume mount point ("Resource
      # busy"), which combined with the entrypoint's `set -e` made this
      # container crash-loop forever. Confirmed live against the actual
      # entrypoint script. Left as the image's own ephemeral layer instead.
    environment:
      - SYMFONY__ENV__DATABASE_HOST=wallabag-db
      - SYMFONY__ENV__DATABASE_PORT=5432
      - SYMFONY__ENV__DATABASE_NAME=wallabag
      - SYMFONY__ENV__DATABASE_USER=wallabag
      - SYMFONY__ENV__DATABASE_PASSWORD=${WALLABAG_DB_PASS}
      - SYMFONY__ENV__DATABASE_DRIVER=pdo_pgsql
      - SYMFONY__ENV__MAILER_HOST=${MAILER_HOST}
      - SYMFONY__ENV__MAILER_PORT=${MAILER_PORT}
      - SYMFONY__ENV__FROM_EMAIL=${WALLABAG_EMAIL}
      - SYMFONY__ENV__FOSUSER_REGISTRATION=false
    depends_on:
      - wallabag-db
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ========== WALLABAG DATABASE ==========
  wallabag-db:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: wallabag-db
    labels:
      # Floating minor tag - Watchtower applies patch/minor updates only
      # (a major bump still needs the tag changed by hand).
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - wallabag-postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${WALLABAG_DB_PASS}
      - POSTGRES_USER=wallabag
      - POSTGRES_DB=wallabag
    networks:
      - privacy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallabag"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ========== ADVANCED NOTE-TAKING (Replace OneNote) ==========
  # zadam/trilium is abandoned (archived upstream); TriliumNext is the
  # actively-maintained community successor with the same data format.
  trilium:
    image: triliumnext/trilium:v0.105.0
    restart: unless-stopped
    container_name: trilium
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No published port - reachable only via Caddy's notes.{$DOMAIN} route.
    # See the navidrome comment above for why.
    volumes:
      - trilium-data:/home/node/trilium-data
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      # Not curl (this image doesn't ship it) and not "localhost" (resolves
      # to ::1 in this container, which nothing listens on - Trilium only
      # binds 0.0.0.0:8080/IPv4, so that combination silently
      # "Connection refused"d forever) - both confirmed live.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ========== PROJECT MANAGEMENT (Replace Asana/Trello) ==========
  focalboard:
    image: mattermost/focalboard:7.11.4
    restart: unless-stopped
    container_name: focalboard
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No published port - reachable only via Caddy's boards.{$DOMAIN}
    # route. See the navidrome comment above for why.
    volumes:
      - focalboard-data:/opt/focalboard/data
    environment:
      - FOCALBOARD_PORT=8000
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      # No healthcheck: this image ships no shell, curl, wget, or busybox
      # at all (confirmed live) - there is no executable left to run one
      # with. Docker's own container-running state (no crash-loop) is the
      # only signal available; rely on that instead of a perpetually
      # "unhealthy" false negative.
      disable: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  # ========== ONLINE DOCUMENT EDITOR (Integrates with Nextcloud) ==========
  # Deliberately still publishes its port, unlike every other service in
  # this file: Nextcloud's OnlyOffice integration embeds the editor as an
  # iframe your browser loads directly from OnlyOffice's own address, not
  # something Nextcloud proxies server-side - so it has to be reachable by
  # end-user browsers somehow. A security audit flagged this alongside the
  # others; not fixed the same way (just removing the port) because that
  # would break document editing outright, not just close unused exposure.
  # Not internet-facing in practice given CGNAT/no port forwarding, only
  # LAN-reachable - see TROUBLESHOOTING.md for the real fix (a proper
  # office.{$DOMAIN} Caddy route + reconfiguring Nextcloud's OnlyOffice
  # connector URL), tracked as a follow-up rather than rushed here.
  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    restart: unless-stopped
    container_name: onlyoffice
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No published port: no Caddy route, and not meant to be browsed
    # directly - Nextcloud's own Office integration reaches it internally
    # over privacy-network. A security audit found it published to the
    # host anyway (JWT_ENABLED below already required a valid token for
    # any request, so this wasn't as severe as the auth-free findings
    # elsewhere, but still unnecessary exposure).
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${NEXTCLOUD_ADMIN_PASSWORD}
      - ALLOW_PRIVATE_IP_ADDRESS=true
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G

  # ========== CALENDAR/CONTACTS (Alternative to Nextcloud) - Optional ==========
  radicale:
    image: tomsquest/docker-radicale:3.8.0.0
    restart: unless-stopped
    container_name: radicale
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No published host port: reachable only via Caddy's cal.{$DOMAIN}
    # route (caddy-network) - this used to publish 5232 directly, bypassing
    # Caddy's TLS/rate-limiting/security-headers/basic_auth entirely, the
    # same issue already fixed for Gotify (see CHANGELOG.md 1.2.1).
    volumes:
      # /data, not /var/lib/radicale: confirmed live against this exact
      # pinned image version that its actual default filesystem_folder is
      # /data/collections. The old /var/lib/radicale mount didn't match
      # anything the image reads, so every calendar/contact would have
      # been written to the container's own ephemeral filesystem instead
      # of this named volume - gone on every container recreation.
      - radicale-data:/data
    environment:
      # Real auth is enforced at Caddy (basic_auth on cal.{$DOMAIN} - see
      # caddy/Caddyfile) rather than here: this image's own auth options
      # are more limited, and CalDAV/CardDAV clients handle a fronting
      # proxy's Basic-auth challenge identically to the server's own, so
      # there's no benefit to configuring both. Leaving Radicale's own
      # auth at its default (none) is safe specifically because Caddy is
      # the only network path to this container - see the port comment
      # above.
      - RADICALE_USERS_TYPE=none
      - RADICALE_AUTH_TYPE=none
    networks:
      - privacy-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5232"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  # Navidrome
  navidrome-config:
    driver: local

  # Syncthing
  syncthing-config:
    driver: local

  # Nextcloud
  nextcloud-data:
    driver: local
  nextcloud-config:
    driver: local
  nextcloud-db:
    driver: local

  # Paperless
  paperless-data:
    driver: local
  paperless-media:
    driver: local
  paperless-export:
    driver: local
  paperless-postgres:
    driver: local
  paperless-redis:
    driver: local

  # Wallabag
  wallabag-data:
    driver: local
  wallabag-postgres:
    driver: local

  # Trilium
  trilium-data:
    driver: local

  # Focalboard
  focalboard-data:
    driver: local

  # Radicale
  radicale-data:
    driver: local

  # OnlyOffice
  onlyoffice-data:
    driver: local
  onlyoffice-logs:
    driver: local
