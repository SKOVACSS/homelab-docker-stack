<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Admin dashboard background: deep night teal, "control room" glow. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131a"/>
      <stop offset="0.55" stop-color="#0b1d26"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5fd4c4" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <g filter="url(#soft)">
    <circle cx="260" cy="180" r="340" fill="#0f766e" fill-opacity="0.55"/>
    <circle cx="1650" cy="260" r="300" fill="#1e3a8a" fill-opacity="0.55"/>
    <circle cx="1180" cy="930" r="360" fill="#115e59" fill-opacity="0.45"/>
    <circle cx="520" cy="980" r="240" fill="#312e81" fill-opacity="0.35"/>
  </g>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
