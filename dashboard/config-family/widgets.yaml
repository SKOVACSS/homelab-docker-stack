- greeting:
    text_size: 2xl
    text: Welcome home

- datetime:
    text_size: lg
    format:
      weekday: long
      month: long
      day: numeric

# Searches go to the household's own SearXNG (search.DOMAIN), not a
# third-party engine.
- search:
    provider: custom
    url: "https://search.{{HOMEPAGE_VAR_DOMAIN}}/search?q="
    target: _blank
    focus: true
