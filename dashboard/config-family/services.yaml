# Household apps only - no admin tools, no live widgets (those need API
# keys this instance deliberately doesn't have), no Docker status.
# Everyone signed in sees every tile; each app still does its own access
# check. To add an app, copy a tile from ../config/services.yaml minus its
# widget/server/container lines.

- Watch:
    - Plex:
        icon: plex.png
        href: "https://plex.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Movies & TV
    - Jellyfin:
        icon: jellyfin.png
        href: "https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Movies & TV (if Plex misbehaves)
    - Requests:
        icon: overseerr.png
        href: "https://requests.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Ask for a movie or show

