# Household apps only - no admin tools and no live widgets (those need API
# keys this instance deliberately doesn't have). Each tile is named
# "Plain name (App name)" so the family can match it to the phone app or
# a how-to, and shows a status dot from the read-only Docker proxy
# (docker.yaml): green = ready; grey/red = asleep or down. Apps marked
# "wakes on open" sleep when idle and start on the first visit (~1 min).
# To add an app, copy a tile from ../config/services.yaml minus its widget.

- Watch:
    - Movies & TV (Plex):
        icon: plex.png
        href: "https://plex.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Movies & TV
        server: my-docker
        container: plex
