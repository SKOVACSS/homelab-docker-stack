# wger's own nginx config (wger-project/docker config/nginx.conf), trimmed:
# serves static/media files and splits the app (/) from PowerSync (/ps/).
# Caddy in front does TLS, the Authentik wall and Sablier.
upstream wger {
    server web:8000;
}
upstream powersync {
    server powersync:8080;
}
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
server {
    listen 80;
    client_max_body_size 100M;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout 300s;
    }
    # The phone app's API: never pass a sign-in header through here (the
    # Authentik wall doesn't cover these paths).
    location /api/ {
        proxy_pass http://wger;
        proxy_set_header X-Authentik-Username "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_redirect off;
    }
    location /ps/ {
        proxy_pass http://powersync/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1d;
        add_header X-Accel-Buffering no always;
    }
    location /static/ {
        alias /wger/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /media/ {
        alias /wger/media/;
    }
}
