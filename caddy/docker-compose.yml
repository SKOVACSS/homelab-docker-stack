services:
  caddy:
    build: .
    restart: unless-stopped
    # Kept for LAN-direct access (faster than round-tripping through
    # Cloudflare when you're already on the home network) - not required
    # for remote access, which goes through cloudflared below instead.
    # Safe to remove if you never need to reach anything by local IP.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      # DOMAIN, QBIT_PORT, CLOUDFLARE_API_TOKEN and MAIL_DOMAIN are read
      # directly by the Caddyfile (via {$VAR} substitution at config-load
      # time), not by docker compose variable interpolation, so they must
      # be passed through here explicitly.
      DOMAIN: ${DOMAIN}
      QBIT_PORT: ${QBIT_PORT}
      SLSKD_WEBUI_PORT: ${SLSKD_WEBUI_PORT}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Only set MAIL_DOMAIN in caddy/.env if Mailu needs to live on a
      # *different* domain than everything else (e.g. your main domain
      # already has real email through another provider) - defaults to
      # DOMAIN otherwise, so leaving it unset is the same as before this
      # existed. See the EMAIL section of ./Caddyfile and SETUP.md.
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${DOMAIN}}
      # Basic-auth credentials for Radicale (see the CALENDAR/CONTACTS
      # section in ./Caddyfile) - its own auth is disabled entirely, so
      # this is its only real gate. gui-installer.ps1 generates both the
      # plaintext password (in credentials-export.json) and this bcrypt
      # hash (via `caddy hash-password`) together, so the hash is never
      # typed by hand. Sonarr/Radarr/Prowlarr/Lidarr and qBittorrent used
      # to have a similar ARR_AUTH_*/QBIT_AUTH_* pair here too - removed
      # once confirmed each already has its own real, mandatory login,
      # making Caddy's copy pure redundant friction with worse autofill
      # than each app's own login form.
      RADICALE_AUTH_USER: ${RADICALE_AUTH_USER}
      RADICALE_AUTH_HASH: ${RADICALE_AUTH_HASH}
    networks:
      - caddy-network
    healthcheck:
      # Not /health: Caddy's admin API has no such route by default (404,
      # confirmed live) - /config/ is the lightweight always-200-if-alive
      # endpoint instead. -s -o /dev/null is deliberate, not just tidiness:
      # /config/ echoes back Caddy's full live config, including the
      # Cloudflare API token and every basic-auth hash - letting curl print
      # that body would put it in this healthcheck's log
      # (`docker inspect`/`docker events`) on every single successful
      # check, forever. Discarding it keeps only the HTTP status, which is
      # all a healthcheck needs.
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      # Left disabled deliberately, not swept up in the everything-else
      # auto-update rollout: this image is a local build, not pulled from a
      # registry, so there's no upstream tag for Watchtower to check - the
      # label would just be a no-op that adds noise to its logs.
      - "com.centurylinklabs.watchtower.enable=false"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # cloudflared - the actual answer to "server is behind Starlink's CGNAT":
  # makes an outbound-only connection to Cloudflare's network, so nothing
  # needs to be port-forwarded (impossible under CGNAT anyway, since you
  # don't control a real public IP to forward to). Uses a *token-based*
  # (remotely-managed) tunnel deliberately, not a local config.yml +
  # credentials.json - the ingress rules live in the Cloudflare dashboard
  # instead of a file this repo would have to template per-deployment,
  # and the only secret this needs is one token, matching how every other
  # user-obtained credential in this repo (Plex claim token, ProtonVPN
  # password) already works. See SETUP.md for the one-time tunnel setup:
  # creating the tunnel, getting this token, and the two Public Hostname
  # rules to add (a wildcard covering every service, plus one exception
  # for Mailu's own certificate challenge).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    container_name: cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - caddy-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  caddy-network:
    driver: bridge
    name: caddy-network
