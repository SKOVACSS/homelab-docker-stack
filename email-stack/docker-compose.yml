# Email Stack - Self-Hosted Email Server
# Replaces: Gmail, ProtonMail (privacy-respecting email)
# Services: Mailu (all-in-one email solution)
# Features: IMAP, POP3, SMTP, Webmail, Spam filtering, Antivirus, CalDAV/CardDAV
#
# Rebuilt against Mailu's own official reference compose (2024.06.58) after
# a live audit found this stack was missing three of Mailu's own services
# (front, antivirus, webdav) and had TLS silently disabled on Dovecot and
# entirely unconfigured on Postfix - see CHANGELOG.md. Every *_ADDRESS var
# below exists because Mailu's own containers default to expecting bare
# service names ("admin", "antispam", etc.); since this stack uses
# "mailu-*" names instead, every cross-service address must be set
# explicitly or the default lookup fails.

networks:
  email-network:
    driver: bridge
    name: email-network
    ipam:
      config:
        - subnet: 172.30.0.0/24
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true

services:
  # mailu-resolver: Mailu requires a DNSSEC-*validating* resolver, not just
  # a forwarding one - Docker's built-in 127.0.0.11 doesn't validate, and
  # mailu-admin refuses to start without one (confirmed live: it fails
  # outright with "your DNS resolver isn't doing DNSSEC validation" against
  # the Docker default). This is Mailu's own unbound build, exactly what
  # their own docs recommend running for this rather than a public
  # resolver. It only handles the DNSSEC-sensitive external lookups
  # (RESOLVER_ADDRESS below) - container-name resolution is untouched and
  # still goes through Docker's normal embedded DNS.
  mailu-resolver:
    image: ghcr.io/mailu/unbound:2024.06.58
    restart: unless-stopped
    container_name: mailu-resolver
    environment:
      - SUBNET=172.30.0.0/24
    networks:
      - email-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ========== MAILU: All-in-One Email Server ==========
  mailu-redis:
    image: redis:8-alpine
    restart: unless-stopped
    container_name: mailu-redis
    volumes:
      - mailu-redis:/data
    networks:
      - email-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # mailu-front: Mailu's own nginx gateway. This is what was missing before.
  # It does NOT bind 80/443 - Caddy stays the only thing owning those ports
  # (see caddy/Caddyfile's "http://mail.{$DOMAIN}" block, which lets Caddy
  # pass front's own Let's Encrypt HTTP-01 challenge through without Caddy
  # obtaining a competing certificate for the same hostname). Front DOES
  # bind the actual mail protocol ports directly, since those go straight
  # to it rather than through Caddy - it terminates TLS for SMTP/IMAP/POP3
  # using its own certbot-issued certificate, then proxies decrypted
  # traffic internally to mailu-smtp/mailu-imap.
  mailu-front:
    image: ghcr.io/mailu/nginx:2024.06.58
    restart: unless-stopped
    container_name: mailu-front
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "25:25"      # SMTP
      - "465:465"    # SMTPS
      - "587:587"    # Submission
      - "110:110"    # POP3
      - "995:995"    # POP3S
      - "143:143"    # IMAP
      - "993:993"    # IMAPS
    volumes:
      - mailu-certs:/certs
      - mailu-dkim:/dkim
    environment:
      - DOMAIN=${DOMAIN}
      - HOSTNAMES=mail.${DOMAIN}
      - POSTMASTER=admin
      - TLS_FLAVOR=letsencrypt
      - MESSAGE_SIZE_LIMIT=50000000
      - SUBNET=0.0.0.0/0
      - RESOLVER=mailu-resolver
      - ADMIN_ADDRESS=mailu-admin
      - ANTISPAM_ADDRESS=mailu-rspamd
      - IMAP_ADDRESS=mailu-imap
      - POP3_ADDRESS=mailu-imap
      - SMTP_ADDRESS=mailu-smtp
      - WEBMAIL_ADDRESS=mailu-webmail
      - WEBDAV_ADDRESS=mailu-webdav
      - REAL_IP_HEADER=
      - REAL_IP_FROM=
    depends_on:
      - mailu-admin
    networks:
      - email-network
      # So Caddy can reach it internally for the ACME challenge passthrough
      # (see caddy/Caddyfile) - front itself never publishes 80/443.
      - caddy-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  mailu-admin:
    image: ghcr.io/mailu/admin:2024.06.58
    restart: unless-stopped
    container_name: mailu-admin
    dns:
      - 172.30.0.3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No host port published: reachable only via Caddy's mailadmin.{$DOMAIN}
    # route (caddy-network), keeping the firewall model to 80/443/WireGuard only.
    volumes:
      - mailu-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MAILU_VERSION=latest
      - SECRET_KEY=${MAILU_SECRET_KEY}
      - DOMAIN=${DOMAIN}
      - HOSTNAMES=mail.${DOMAIN}
      - POSTMASTER=admin
      - ADMIN=true
      # Confirmed against Mailu's own docs: the initial-admin bootstrap vars
      # are INITIAL_ADMIN_ACCOUNT/_DOMAIN/_PW (not _PASSWORD - that name is
      # silently ignored, so this account was never actually being created
      # on a real deploy) and INITIAL_ADMIN_DOMAIN is required to build the
      # admin@domain address. "MAIL_ADMIN" was never a real Mailu variable -
      # dead config left over from before the rebuild, removed. MODE=update
      # is Mailu's own recommendation, so this doesn't error out on restart
      # once the account already exists.
      - INITIAL_ADMIN_ACCOUNT=${MAIL_ADMIN_USER}
      - INITIAL_ADMIN_DOMAIN=${DOMAIN}
      - INITIAL_ADMIN_PW=${MAIL_ADMIN_PASSWORD}
      - INITIAL_ADMIN_MODE=update
      # No SQLALCHEMY_DATABASE_URI override: admin's own default
      # (sqlite:////data/main.db, in the mailu-data volume already mounted
      # above) is what Mailu's own docs recommend - "there is currently very
      # little data to be stored [and] SQLite is deemed both sufficient,
      # simpler and more reliable overall" than a separate Postgres. This
      # stack used to run a mailu-database Postgres container here, but it
      # was set via a variable named DATABASE_URL - not a real Mailu config
      # key, silently ignored - so admin had been running on SQLite the
      # whole time regardless, and that Postgres container was dead weight.
      # Removed rather than fixed the variable name, in line with Mailu's
      # own recommendation.
      - REDIS_URL=redis://mailu-redis:6379
      - REDIS_ADDRESS=mailu-redis
      - SQLALCHEMY_TRACK_MODIFICATIONS=false
      - DKIM_SELECTOR=default
      - DKIM_PATH=/dkim/{domain}.{selector}.key
      - ANTIVIRUS=clamav
      - WEBDAV=radicale
      - WEBMAIL=roundcube
      - RESOLVER=mailu-resolver
    depends_on:
      - mailu-redis
    networks:
      - email-network
      - caddy-network
    healthcheck:
      # Confirmed live: admin's gunicorn binds :8080 internally, not :80,
      # AND "/" itself 404s unconditionally (not a routed path) - this
      # healthcheck was passing the wrong URL, so the container could never
      # actually report healthy. /admin/ redirects (302) to /sso/login,
      # which is the first real page and returns 200 without needing auth.
      test: ["CMD", "curl", "-f", "http://localhost:8080/sso/login"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  mailu-imap:
    image: ghcr.io/mailu/dovecot:2024.06.58
    restart: unless-stopped
    container_name: mailu-imap
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No host ports: mailu-front now owns 143/993/110/995 and proxies
    # decrypted traffic here internally over email-network.
    volumes:
      - mailu-mail:/mail
      - mailu-dkim:/dkim
    environment:
      - DOMAIN=${DOMAIN}
      - HOSTNAMES=mail.${DOMAIN}
      - IMAP_ADDRESS=0.0.0.0
      - ADMIN_ADDRESS=mailu-admin
      - ADMIN_PORT=5555
      - ANTIVIRUS=clamav
      - ANTIVIRUS_ADDRESS=mailu-antivirus
      - REDIS_URL=redis://mailu-redis:6379
    depends_on:
      - mailu-admin
      - mailu-redis
    networks:
      - email-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "143"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  mailu-smtp:
    image: ghcr.io/mailu/postfix:2024.06.58
    restart: unless-stopped
    container_name: mailu-smtp
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No host ports: mailu-front now owns 25/465/587 and proxies decrypted
    # traffic here internally over email-network.
    volumes:
      - mailu-mail:/mail
      - mailu-dkim:/dkim
    environment:
      - DOMAIN=${DOMAIN}
      - HOSTNAMES=mail.${DOMAIN}
      - MESSAGE_SIZE_LIMIT=50000000
      - ADMIN_ADDRESS=mailu-admin
      - ADMIN_PORT=5555
      - REDIS_URL=redis://mailu-redis:6379
    depends_on:
      - mailu-admin
      - mailu-redis
    networks:
      - email-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  mailu-rspamd:
    image: ghcr.io/mailu/rspamd:2024.06.58
    restart: unless-stopped
    container_name: mailu-rspamd
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No host port published: rspamd is only called internally by postfix/
    # dovecot over email-network, nothing outside the stack needs to reach it.
    volumes:
      - mailu-filter:/var/lib/rspamd
      - mailu-dkim:/dkim
    environment:
      - DOMAIN=${DOMAIN}
      - ADMIN_ADDRESS=mailu-admin
      - ADMIN_PORT=5555
      - ANTIVIRUS=clamav
      - ANTIVIRUS_ADDRESS=mailu-antivirus
      - REDIS_URL=redis://mailu-redis:6379
    depends_on:
      - mailu-redis
    networks:
      - email-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11333/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # mailu-antivirus: Mailu's own ClamAV build - the piece originally planned
  # as a standalone ClamAV container. Using Mailu's own image instead of a
  # generic one: it's the same underlying engine, pre-wired for rspamd's
  # antivirus.conf (ANTIVIRUS_ADDRESS above), and stays version-locked to
  # the rest of this stack rather than tracking a separate release train.
  # NOTE: mailu/clamav's version numbering (2.0.x) is independent of the
  # rest of Mailu's 2024.06.x release train - it tracks the ClamAV engine's
  # own release cycle, not Mailu's. Confirmed via GHCR's actual published
  # tags rather than assumed - it does not follow the shared VERSION tag.
  mailu-antivirus:
    image: ghcr.io/mailu/clamav:2.0.43
    restart: unless-stopped
    container_name: mailu-antivirus
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - mailu-antivirus:/data
    networks:
      - email-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # mailu-webdav: CalDAV/CardDAV for contacts and calendars tied to mail
  # accounts - a different use case from privacy-stack's standalone
  # Radicale (general-purpose, not mail-account-linked). Reachable through
  # mailu-front (WEBDAV_ADDRESS above); no direct external route added here.
  mailu-webdav:
    image: ghcr.io/mailu/radicale:2024.06.58
    restart: unless-stopped
    container_name: mailu-webdav
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - mailu-webdav:/data
    networks:
      - email-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  mailu-webmail:
    image: ghcr.io/mailu/webmail:2024.06.58
    restart: unless-stopped
    container_name: mailu-webmail
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No host port published: reachable only via Caddy's webmail.{$DOMAIN}
    # route (caddy-network), keeping the firewall model to 80/443/WireGuard only.
    volumes:
      - mailu-webmail:/var/www/html/plugins/persistent
    environment:
      - DOMAIN=${DOMAIN}
      - HOSTNAMES=mail.${DOMAIN}
      - SECRET_KEY=${MAILU_SECRET_KEY}
      - MESSAGE_SIZE_LIMIT=50000000
      - FRONT_ADDRESS=mailu-front
      - IMAP_ADDRESS=mailu-imap
      - IMAP_PORT=143
      - SMTP_ADDRESS=mailu-smtp
      - SMTP_PORT=587
    depends_on:
      - mailu-imap
      - mailu-smtp
    networks:
      - email-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  mailu-redis:
    driver: local
  mailu-data:
    driver: local
  mailu-mail:
    driver: local
  mailu-dkim:
    driver: local
  mailu-filter:
    driver: local
  mailu-webmail:
    driver: local
  mailu-certs:
    driver: local
  mailu-antivirus:
    driver: local
  mailu-webdav:
    driver: local
