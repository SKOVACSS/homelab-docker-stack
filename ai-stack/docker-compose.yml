# AI stack - local LLM chat via vLLM (Intel XPU) + Open WebUI.
#
# GPU-accelerated for real, confirmed by actually running inference (not
# just checking device detection) - see TROUBLESHOOTING.md ("vLLM's
# Level-Zero/oneAPI backend is the one that actually works on Docker
# Desktop + WSL2 + Intel Arc") for the full story. Short version: this
# stack originally shipped on llama.cpp's Vulkan backend, on the theory
# that Mesa's WSL2 "dzn" driver would translate Vulkan to D3D12 over
# /dev/dxg - confirmed that doesn't work (Ubuntu's mesa-vulkan-drivers
# package doesn't build dzn at all). vLLM's XPU backend takes a
# completely different path - Level-Zero/oneAPI, the same compute stack
# (not Vulkan/VAAPI) that already gets Immich's OpenVINO ML working over
# this same /dev/dxg device - and it's the one that actually works here,
# confirmed end-to-end (real chat completions generated on the B580, not
# just "device detected").
#
# Model choice: Qwen2.5-7B-Instruct-AWQ, not something bigger, because
# vLLM's own memory overhead (activation buffers, torch.compile scratch
# space) is heavier than llama.cpp's - a 14B AWQ model's ~9.4GB of
# weights alone left only ~0.15GB free for KV cache on this 12GB card,
# not enough to serve even one request. 7B AWQ (~5GB weights) leaves
# comfortable headroom for an 8192-token context, confirmed by actually
# loading it and completing a real chat request, not just estimating.

networks:
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true

  ai-network:
    driver: bridge
    name: ai-network

services:
  vllm:
    image: intel/vllm:0.17.0-xpu
    restart: unless-stopped
    container_name: vllm
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      # Microsoft's WSL2 GPU paravirtualization libs (libd3d12.so,
      # libdxcore.so) - vLLM's Level-Zero runtime needs these alongside
      # /dev/dxg itself, same as Immich's openvino-wsl-dxgonly hwaccel
      # profile (see immich-app/hwaccel.ml.yml).
      - /usr/lib/wsl:/usr/lib/wsl
      # Hugging Face's own cache layout, so a model already pulled here
      # isn't re-downloaded if anything else on this host also uses it.
      - vllm-hf-cache:/root/.cache/huggingface
    # Docker's default (64MB) is sized for tensor-parallel/multi-GPU vLLM
    # setups, where NCCL uses /dev/shm heavily for inter-GPU IPC and can
    # crash with a Bus error at the default size. Confirmed live this
    # isn't currently being hit (single B580, no tensor parallelism -
    # `df -h /dev/shm` inside the container shows 8KB used out of 64MB) -
    # this is cheap insurance against a future change (a bigger model,
    # more concurrent requests, a second GPU) rather than a fix for an
    # active problem.
    shm_size: '2gb'
    command:
      - "vllm"
      - "serve"
      # Change this to try a different model - see
      # https://huggingface.co/models?other=vllm for what's compatible.
      # Stay AWQ-quantized and mind the VRAM math above if sizing up.
      - "Qwen/Qwen2.5-7B-Instruct-AWQ"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.9"
      # Tool calling (web search, tools, "native" function calling in
      # Open WebUI). Without these, any request with tool_choice "auto"
      # fails with: '"auto" tool choice requires --enable-auto-tool-choice
      # and --tool-call-parser to be set'. The parser must match the
      # model family: hermes for Qwen2.5/Qwen3 (llama3_json for Llama 3,
      # mistral for Mistral) - update it if the model above changes.
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    # No Caddy route and no caddy-network membership - this is a backend
    # API only Open WebUI needs to reach, same reasoning as
    # immich-machine-learning not getting one either.
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      # Generous start period: first boot downloads ~5GB of weights, then
      # vLLM's torch.compile warmup (roughly a minute) before it can
      # respond to anything, including this healthcheck.
      start_period: 10m
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # On demand via Sablier (see caddy/docker-compose.yml): the whole AI
      # stack starts when someone opens chat., stops after 30 min idle.
      - "sablier.enable=true"
      - "sablier.group=ai"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 12G
        reservations:
          cpus: '1.0'
          memory: 4G

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    restart: unless-stopped
    container_name: open-webui
    environment:
      # Only applies on Open WebUI's FIRST start - after that, the value saved
      # in its own database (Admin Settings -> Connections) wins. Confirmed
      # live: an old saved http://llama-server:8080/v1 silently overrode
      # this, leaving "no models available". Change it in the admin UI (or
      # the `config` table in webui.db), not only here.
      - OPENAI_API_BASE_URLS=http://vllm:8000/v1
      # vLLM doesn't check this, but Open WebUI expects a non-empty
      # value before it'll treat the backend as configured.
      - OPENAI_API_KEYS=none
      - ENABLE_OLLAMA_API=false
      - WEBUI_URL=https://chat.${DOMAIN}
      # "Continue with Authentik" (authentik/blueprints/app-logins.yaml).
      # Accounts match by email, so an existing account is reused. New
      # users still start as "pending" until an admin approves them.
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - OAUTH_PROVIDER_NAME=Authentik
      - OPENID_PROVIDER_URL=https://auth.${DOMAIN}/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=open-webui
      - OAUTH_CLIENT_SECRET=${OPENWEBUI_OIDC_CLIENT_SECRET}
      - OAUTH_SCOPES=openid email profile
      - OPENID_REDIRECT_URI=https://chat.${DOMAIN}/oauth/oidc/callback
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - vllm
    networks:
      - ai-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "sablier.enable=true"
      - "sablier.group=ai"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  vllm-hf-cache:
    driver: local
  open-webui-data:
    driver: local
