# AI stack - local LLM chat via llama.cpp + Open WebUI.
#
# Runs on CPU, not GPU, despite the /dev/dxg mount below - see
# TROUBLESHOOTING.md ("Vulkan/dzn doesn't actually work on Docker Desktop
# + WSL2 + Intel Arc") for why. Short version: llama-server uses
# llama.cpp's Vulkan backend (not the SYCL "intel" one, which needs a
# real DRM render node this host doesn't expose), on the theory that
# Mesa's WSL2 "dzn" driver would translate Vulkan to D3D12 over
# /dev/dxg the same way Immich's OpenVINO ML already uses that device
# successfully. Confirmed directly inside the container that Ubuntu's
# mesa-vulkan-drivers package doesn't actually build the dzn ICD at all,
# so this silently falls back to CPU inference instead - still
# functional, just slower. The /dev/dxg mount is left in place because
# it's harmless and this may get revisited (see TROUBLESHOOTING.md for
# the intel/vllm XPU evaluation in progress).

networks:
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true

  ai-network:
    driver: bridge
    name: ai-network

services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    restart: unless-stopped
    container_name: llama-server
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      # Hugging Face's own cache layout, so a model already pulled here
      # isn't re-downloaded if anything else on this host also uses it.
      - llama-hf-cache:/root/.cache/huggingface
    command:
      # bartowski's GGUF quant of Qwen3 14B - the Q4_K_M file is ~8.4GB,
      # comfortably inside the B580's 12GB VRAM with room left for context.
      # First boot downloads it (a few minutes); every boot after that
      # reuses llama-hf-cache above. Change the -hf argument to try a
      # different model/quant - see https://huggingface.co/models?library=gguf.
      - "-hf"
      - "bartowski/Qwen_Qwen3-14B-GGUF:Q4_K_M"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "8192"
      - "--n-gpu-layers"
      - "99"
    # No Caddy route and no caddy-network membership - this is a backend
    # API only Open WebUI needs to reach, same reasoning as
    # immich-machine-learning not getting its own route.
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      # Generous start period: first boot downloads an ~8GB model before
      # the server can respond to anything, including this healthcheck.
      start_period: 10m
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          cpus: '1.0'
          memory: 2G

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    restart: unless-stopped
    container_name: open-webui
    environment:
      - OPENAI_API_BASE_URLS=http://llama-server:8080/v1
      # llama-server doesn't check this, but Open WebUI expects a
      # non-empty value before it'll treat the backend as configured.
      - OPENAI_API_KEYS=none
      - ENABLE_OLLAMA_API=false
      - WEBUI_URL=https://chat.${DOMAIN}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - llama-server
    networks:
      - ai-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  llama-hf-cache:
    driver: local
  open-webui-data:
    driver: local
