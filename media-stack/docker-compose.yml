# Network Strategy:
# - caddy-network:     Public-facing (routes from Caddy reverse proxy) - EXTERNAL, owned by the caddy stack
# - internal-network:  Internal only (no internet access)
# - media-network:     Media apps + indexer queries (can reach internet)
#
# FIX APPLIED: caddy-network was previously created HERE as its own bridge
# network with a custom subnet, which conflicted with 5 other stacks
# (privacy-stack, security-stack, email-stack, monitoring-stack,
# notification-stack) that expect caddy-network to already exist as an
# EXTERNAL network owned by the caddy stack. Whichever stack started first
# was silently "winning" ownership of the network name. caddy-network is now
# correctly marked external here, matching the corrected caddy stack.

networks:
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true

  internal-network:
    driver: bridge
    name: internal-network
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/16

  media-network:
    driver: bridge
    name: media-network
    ipam:
      config:
        - subnet: 172.23.0.0/16

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    restart: unless-stopped
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      # openvpn (default) uses PROTON_OPENVPN_*; set to "wireguard" in .env to
      # use PROTON_WIREGUARD_KEY instead (see gluetun's ProtonVPN docs).
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      # +pmp is ProtonVPN's opt-in for NAT-PMP port forwarding on OpenVPN -
      # without it, VPN_PORT_FORWARDING below times out on every connect and
      # no peer can ever connect inbound (confirmed live: torrents crawled
      # at <1 Mbps). Appended here so .env keeps the plain username.
      - OPENVPN_USER=${PROTON_OPENVPN_USERNAME}+pmp
      - OPENVPN_PASSWORD=${PROTON_OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${PROTON_COUNTRIES}
      - WIREGUARD_PRIVATE_KEY=${PROTON_WIREGUARD_KEY}
      - WIREGUARD_ADDRESSES=${PROTON_WIREGUARD_ADDRESSES}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,10.0.0.0/8
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # ProtonVPN hands out a different forwarded port on every connect, so
      # push it into qBittorrent each time (gluetun's documented recipe).
      # Needs qBittorrent's "bypass authentication for clients on localhost"
      # on - safe here because localhost is gluetun's own network namespace,
      # shared only with qbittorrent/slskd. DOWN resets the port so a
      # reconnect re-applies cleanly (qBittorrent otherwise ignores a
      # "change" to the port it already has after the tunnel drops).
      - 'VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c ''wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:${QBIT_PORT:-8080}/api/v2/app/setPreferences'''
      - 'VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c ''wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:${QBIT_PORT:-8080}/api/v2/app/setPreferences'''
    ports:
      # BT_PORT = the BitTorrent peer port, which MUST match whatever port
      # ProtonVPN forwards you (check gluetun logs after connecting, then
      # update BT_PORT in .env and redeploy) - this one has to be published,
      # real peers on the internet connect to it directly, unlike a web UI.
      # QBIT_PORT (qBittorrent's WebUI) is NOT published here anymore: it's
      # proxied by Caddy (qbit.{$DOMAIN}) same as every other admin UI, and
      # a direct LAN-reachable copy bypassing Caddy served no purpose - a
      # security audit flagged the same redundant-port pattern repo-wide.
      - "${BT_PORT}:${BT_PORT}"
      - "${BT_PORT}:${BT_PORT}/udp"
      # SLSK_PORT = slskd's Soulseek peer listen port (same idea as BT_PORT,
      # one port below). Caveat: ProtonVPN's port forwarding only assigns
      # ONE forwarded port per VPN connection, and BT_PORT already claims
      # it - so this port isn't actually reachable from the internet the
      # way BT_PORT is. Soulseek still works fully for searching and
      # downloading either way; the only effect is reduced visibility as
      # an upload source for other peers, same as being behind any NAT
      # without forwarding. See TROUBLESHOOTING.md.
      - "${SLSK_PORT}:${SLSK_PORT}"
    volumes:
      - ./gluetun:/gluetun
    networks:
      - media-network
      # So Caddy (on caddy-network) can reach gluetun:${QBIT_PORT} to proxy
      # qBittorrent's WebUI - see caddy/Caddyfile's qbit.{$DOMAIN} block.
      - caddy-network
    healthcheck:
      # Not curl: this image doesn't ship it (confirmed live - "curl:
      # executable file not found in $PATH"), which silently made this
      # healthcheck report "unhealthy" forever regardless of the VPN
      # actually working. gluetun's own entrypoint ships a dedicated
      # healthcheck subcommand instead of depending on whatever HTTP
      # client happens to be bundled in a given image version.
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # qBittorrent routed through VPN via gluetun
  # NOTE: network_mode: service:gluetun means qBittorrent shares gluetun's network namespace
  # Therefore: NO ports: mapping here - ports are published on gluetun only (see above)
  # Sonarr/Radarr/Prowlarr must point download_client to gluetun hostname, not qbittorrent
  # hotio doesn't publish stable numbered version tags for its images -
  # `release` is its documented stable channel (vs. `nightly`/`testing`).
  # Watchtower is disabled for this service (label below), so it only
  # updates when you deliberately run `docker compose pull`.
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release
    restart: unless-stopped
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_started
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=${QBIT_PORT}
      - BT_PORT=${BT_PORT}
    volumes:
      - qbit-config:/config
      - ${QBIT_DOWNLOADS_PATH}:/downloads
      - ${MEDIA_MOVIES}:/media/movies:ro
      - ${MEDIA_TV}:/media/tv:ro
      - ${MEDIA_MUSIC}:/media/music:ro
      - ${MEDIA_BOOKS}:/media/books:ro
    # NO ports: section - qBittorrent has no independent network, shares gluetun
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # slskd - a headless Soulseek client with a REST API and its own web UI.
  # Added because public torrent trackers (1337x, YTS, etc. above) rarely
  # carry lossless/hi-res music, while Soulseek is full of genuine CD/vinyl
  # FLAC rips shared directly by other users. Routed through gluetun for
  # the same reason as qBittorrent: Soulseek is P2P, so every peer you
  # transfer with sees your IP unless it's tunneled - see the qBittorrent
  # comment above for the fuller rationale. soularr (below) bridges this
  # to Lidarr's wanted/missing list automatically; the web UI is also
  # useful on its own for manual searches, reachable at slskd.{$DOMAIN}
  # via Caddy - no extra login layer needed, slskd has its own built-in
  # auth (SLSKD_USERNAME/PASSWORD below), unlike Sonarr/Radarr originally.
  slskd:
    image: slskd/slskd:0.26.0
    restart: unless-stopped
    container_name: slskd
    depends_on:
      gluetun:
        condition: service_started
    network_mode: service:gluetun
    environment:
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_SLSK_LISTEN_PORT=${SLSK_PORT}
      - SLSKD_HTTP_PORT=${SLSKD_WEBUI_PORT}
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_SHARED_DIR=/music
      - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
      - slskd-config:/app
      - ${SLSKD_DOWNLOADS_PATH}:/app/downloads
      - ${MEDIA_MUSIC}:/music:ro
    # NO ports: section - shares gluetun's network, same as qBittorrent
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # soularr - bridges Lidarr's "wanted/missing" list to slskd, the same
  # role Completed Download Handling plays for qBittorrent: it searches
  # Soulseek for each missing album, grabs the best match (its default
  # format preference already favors FLAC over mp3 - see
  # media-stack/soularr/config.ini.example), and tells Lidarr to import
  # the result once slskd finishes the transfer. Talks to slskd via
  # gluetun's hostname, not "slskd" - see the qBittorrent comment above
  # for why a service on network_mode: service:gluetun has no name of its
  # own on the network.
  soularr:
    image: mrusse08/soularr:v1.2.2
    restart: unless-stopped
    container_name: soularr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - SCRIPT_INTERVAL=300
      - WEBUI_ENABLED=true
      - WEBUI_PORT=8265
    volumes:
      - ${SLSKD_DOWNLOADS_PATH}:/downloads
      - ./soularr:/data
    networks:
      - media-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  sonarr:
    image: ghcr.io/hotio/sonarr:release
    restart: unless-stopped
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - sonarr-config:/config
      - ${MEDIA_TV}:/tv
      - ${QBIT_DOWNLOADS_PATH}:/downloads
    # No published port: reachable only via Caddy's sonarr.{$DOMAIN} route
    # (basic_auth-protected - see caddy/Caddyfile's arr_auth), same
    # firewall model as every other admin UI in this repo. Previously
    # published directly, which a security audit found meant this app's
    # own weak/local-only auth default was bypassable straight from the
    # LAN - see TROUBLESHOOTING.md.
    networks:
      - media-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  radarr:
    image: ghcr.io/hotio/radarr:release
    restart: unless-stopped
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - radarr-config:/config
      - ${MEDIA_MOVIES}:/movies
      - ${QBIT_DOWNLOADS_PATH}:/downloads
    # No published port - see the identical comment on sonarr above.
    networks:
      - media-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  prowlarr:
    image: ghcr.io/hotio/prowlarr:release
    restart: unless-stopped
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - prowlarr-config:/config
    # No published port - see the identical comment on sonarr above.
    networks:
      - media-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # FlareSolverr - several public indexers Prowlarr talks to (1337x, EZTV,
  # Kickass Torrents, etc) sit behind Cloudflare's bot challenge, which a
  # plain HTTP request from Prowlarr can't pass - confirmed live via
  # Prowlarr's own indexer test: "blocked by CloudFlare Protection." This
  # runs a real (headless) browser to solve that challenge and hands the
  # resulting session back to Prowlarr, which is configured as an Indexer
  # Proxy (Settings -> Indexers -> Proxies) and applied only to the
  # specific indexers that need it via a tag - untagged indexers bypass it
  # entirely. No web UI is exposed through Caddy; only Prowlarr talks to
  # this, over media-network.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    networks:
      - media-network
    healthcheck:
      # wget isn't in this image (confirmed live: "executable file not
      # found in $PATH") - curl is. Was silently failing every check
      # since deployment; the service itself was fine the whole time.
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Recyclarr - syncs TRaSH Guides' community-maintained Custom Formats and
  # Quality Profiles into Sonarr/Radarr on a schedule, so a search doesn't
  # just grab the first result: releases get scored (reject cam/telesync/
  # upscaled/fake releases outright, prefer well-regarded groups, correct
  # HDR handling, etc). See media-stack/recyclarr/recyclarr.yml.example
  # and TROUBLESHOOTING.md for how this fits with indexer priority.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    restart: unless-stopped
    container_name: recyclarr
    user: "1000:1000"
    environment:
      - TZ=${TZ:-UTC}
      - CRON_SCHEDULE=@daily
    volumes:
      - ./recyclarr:/config
    networks:
      - media-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Readarr (book automation) has been removed: hotio's upstream repo was
  # archived June 2025 and officially retired - it never left beta in its
  # whole lifetime and will not be fixed. See CHANGELOG.md. If you want
  # book automation, look at LazyLibrarian or Chaptarr instead.

  lidarr:
    image: ghcr.io/hotio/lidarr:release
    restart: unless-stopped
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - lidarr-config:/config
      - ${MEDIA_MUSIC}:/music
      - ${QBIT_DOWNLOADS_PATH}:/downloads
      # Same host folder slskd downloads into, mounted at a distinct path
      # since /downloads above is already qBittorrent's. soularr's own
      # config.ini tells it to use this path when it calls Lidarr's import
      # API - see media-stack/soularr/config.ini.example.
      - ${SLSKD_DOWNLOADS_PATH}:/downloads-soulseek
    # No published port - see the identical comment on sonarr above.
    networks:
      - media-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # LazyLibrarian - book/ebook automation, the recommended Readarr
  # replacement noted above. Its standout feature for this use case is a
  # native IRC download provider: IRCHighway's #ebooks channel and its
  # XDCC bots are the primary ebook source in this community - the same
  # thing the user already does manually. No env-var config exists for
  # this (confirmed against linuxserver's own image docs - IRC server/
  # channel/search-bot settings are web-UI only), so that's a one-time
  # setup step - see SETUP.md. Downloads land in the same host folder
  # Calibre-Web-Automated watches below, so a finished IRC grab is picked
  # up, converted, and ready to send to a Kindle with no manual step.
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    restart: unless-stopped
    container_name: lazylibrarian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - lazylibrarian-config:/config
      - ${BOOKS_INGEST_PATH}:/downloads
    networks:
      - media-network
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5299/home"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Calibre-Web-Automated - watches the same folder LazyLibrarian downloads
  # into (/cwa-book-ingest is an INGEST folder, not a library - CWA removes
  # each file after converting and importing it, per its own docs), and can
  # email newly-added books straight to a Kindle's @kindle.com address
  # (Amazon's own free personal-document delivery). SMTP and each family
  # member's Kindle address are set up once through its own web UI - see
  # SETUP.md. TRUSTED_PROXY_COUNT=2 accounts for this stack's two proxy
  # hops (Cloudflare Tunnel, then Caddy) so CWA logs/rate-limits the real
  # client IP instead of Caddy's.
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:v4.0.6
    restart: unless-stopped
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - TRUSTED_PROXY_COUNT=2
    volumes:
      - cwa-config:/config
      - ${BOOKS_INGEST_PATH}:/cwa-book-ingest
      # NOT ${MEDIA_BOOKS} directly - an existing Calibre library (with its
      # own metadata.db) already lives one level down, inside a
      # CalibreLibrary subfolder, alongside unrelated loose files. CWA
      # expects metadata.db at the mounted root, so this has to point at
      # the actual library folder specifically, or CWA won't recognize the
      # existing library and may create a conflicting second one.
      - ${CALIBRE_LIBRARY_PATH}:/calibre-library
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Unpackerr - Sonarr/Radarr/Lidarr can natively import a completed
  # download, but none of them know how to extract an archive (multi-part
  # RAR, zip, etc). Unpackerr bridges that gap: it polls each *arr's queue
  # API, and once an item shows as fully downloaded there (qBittorrent
  # itself never reports a torrent "complete" until every part/piece,
  # including every split-RAR volume, has finished and hash-checked), it
  # extracts any archive found at that item's download path. The *arr
  # apps' own existing import scan (already running on its normal
  # interval) then picks up the extracted media file exactly like it does
  # any other completed download - no separate "transfer" step to build.
  # DELETE_ORIG is deliberately left at its default (false): this stack
  # downloads over BitTorrent, and deleting the source archive right after
  # extraction would corrupt an in-progress seed.
  unpackerr:
    image: golift/unpackerr:0.16.1
    restart: unless-stopped
    container_name: unpackerr
    user: "1000:1000"
    environment:
      - TZ=${TZ:-UTC}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/downloads
      - UN_SONARR_0_PROTOCOLS=torrent
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/downloads
      - UN_RADARR_0_PROTOCOLS=torrent
      - UN_LIDARR_0_URL=http://lidarr:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
      - UN_LIDARR_0_PATHS_0=/downloads
      - UN_LIDARR_0_PROTOCOLS=torrent
    volumes:
      # Same host folder, same container path (/downloads) as qBittorrent
      # and all three *arr apps above - Unpackerr matches archives to
      # queue items by this path, so it must line up exactly.
      - ${QBIT_DOWNLOADS_PATH}:/downloads
    networks:
      - media-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  plex:
    image: plexinc/pms-docker:1.43.4.10903-e5521bd8c
    restart: unless-stopped
    container_name: plex
    # PLEX_HWACCEL is written by _scripts/detect-gpu.ps1 (run automatically
    # by deploy.ps1) into .env - defaults to cpu if unset or no GPU is
    # usable. Hardware transcoding also requires a Plex Pass subscription
    # to actually activate, independent of whether the device is mapped in.
    extends:
      file: hwaccel.transcoding.yml
      service: ${PLEX_HWACCEL:-cpu}
    environment:
      - PLEX_UID=1000
      - PLEX_GID=1000
      - TZ=${TZ:-UTC}
      - PLEX_CLAIM=${PLEX_CLAIM_TOKEN}
      - ADVERTISE_IP=https://${PLEX_DOMAIN}:443/
    volumes:
      - plex-config:/config
      - ${MEDIA_MOVIES}:/movies
      - ${MEDIA_TV}:/tv
      - ${MEDIA_MUSIC}:/music
      - ${MEDIA_PHOTOS}:/photos
    ports:
      - "32400:32400/tcp"
      - "3005:3005/tcp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/web/index.html"]
      interval: 60s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G

  jellyfin:
    image: jellyfin/jellyfin:12.1
    restart: unless-stopped
    container_name: jellyfin
    # JELLYFIN_HWACCEL is written by _scripts/detect-gpu.ps1 (run
    # automatically by deploy.ps1) into .env - defaults to cpu if unset or
    # no GPU is usable. Still needs Dashboard > Playback > Transcoding set
    # to match in Jellyfin's own admin UI - the device being mapped in
    # only makes hardware transcoding possible, not automatic.
    extends:
      file: hwaccel.transcoding.yml
      service: ${JELLYFIN_HWACCEL:-cpu}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - JELLYFIN_PublishedServerUrl=https://${JELLYFIN_DOMAIN}
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_MOVIES}:/movies:ro
      - ${MEDIA_TV}:/tv:ro
      - ${MEDIA_MUSIC}:/music:ro
      - ${MEDIA_PHOTOS}:/photos:ro
    ports:
      - "8096:8096"
      - "8920:8920"
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3G
        reservations:
          cpus: '2.0'
          memory: 1.5G

  # Seerr - lets family/friends browse and request movies/shows themselves
  # instead of asking you directly. Successor to Overseerr (archived by its
  # own maintainers) and Jellyseerr (merged into this project) - the only
  # one of the three still actively maintained, and the only one that
  # supports both Plex AND Jellyfin as a backend, which matters since this
  # stack runs both. Talks to Sonarr/Radarr on media-network to actually
  # add approved requests, and to Plex/Jellyfin (both on caddy-network) to
  # import their logins so family members don't need yet another password.
  # Sonarr/Radarr connections, Plex/Jellyfin sign-in, per-user approval
  # policy, and Gotify notifications are all first-run/admin-UI setup, not
  # env vars - see SETUP.md.
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    restart: unless-stopped
    container_name: seerr
    volumes:
      - seerr-config:/app/config
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=info
    networks:
      - media-network
      - caddy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  gluetun:
    driver: local
  qbit-config:
    driver: local
  sonarr-config:
    driver: local
  radarr-config:
    driver: local
  prowlarr-config:
    driver: local
  lidarr-config:
    driver: local
  slskd-config:
    driver: local
  lazylibrarian-config:
    driver: local
  cwa-config:
    driver: local
  seerr-config:
    driver: local
  plex-config:
    driver: local
  jellyfin-config:
    driver: local
  jellyfin-cache:
    driver: local
