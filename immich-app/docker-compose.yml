# Immich - Google Photos replacement.
#
# Based on the official compose file (https://github.com/immich-app/immich/
# releases/latest/download/docker-compose.yml), adapted to this project's
# conventions: joins caddy-network so Caddy can reverse-proxy photos.DOMAIN
# to immich-server (see caddy/Caddyfile), adds resource limits, and disables
# Watchtower on the stateful services (database/redis/server) the same way
# every other stack does.
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # TRANSCODE_HWACCEL is written by _scripts/detect-gpu.ps1 (run
    # automatically by deploy.ps1) into .env - defaults to cpu (software
    # encode) if unset, so this is always safe with no GPU present. See
    # hwaccel.transcoding.yml for what each profile actually maps to, and
    # why some of them (vaapi-wsl in particular) still fall back to cpu on
    # today's Docker Desktop WSL2 hosts regardless of GPU vendor.
    extends:
      file: hwaccel.transcoding.yml
      service: ${TRANSCODE_HWACCEL:-cpu}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    # LAN address for the mobile app's automatic URL switching (Settings ->
    # Networking): on home Wi-Fi it talks to http://<server LAN IP>:2283
    # directly - full LAN speed and no Cloudflare 100MB upload cap - and
    # falls back to photos.DOMAIN elsewhere. Unreachable from the internet
    # (Starlink CGNAT, nothing forwarded). Docker Desktop's own firewall
    # rule already allows inbound on published ports.
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    networks:
      - immich
      - caddy-network
    restart: unless-stopped
    healthcheck:
      disable: false
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  immich-machine-learning:
    container_name: immich_machine_learning
    # ML_HWACCEL/ML_IMAGE_SUFFIX are written by _scripts/detect-gpu.ps1 (run
    # automatically by deploy.ps1) into .env, detected fresh on every
    # deploy - no manual editing needed regardless of GPU vendor, or
    # whether there's a GPU at all. ML_HWACCEL selects the device/volume
    # profile from hwaccel.ml.yml; ML_IMAGE_SUFFIX picks the matching image
    # variant (each accelerator backend needs its own build, e.g.
    # -openvino, -cuda - unlike transcoding, which uses the same ffmpeg
    # binary for every backend). Both default to plain CPU if unset.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}${ML_IMAGE_SUFFIX:-}
    extends:
      file: hwaccel.ml.yml
      service: ${ML_HWACCEL:-cpu}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    networks:
      - immich
    restart: unless-stopped
    healthcheck:
      disable: false
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks:
      - immich
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Docker volume, not the Windows-shared DB_DATA_LOCATION folder: on
      # Docker Desktop, Postgres writes through that share failed under memory
      # pressure ("could not write to log file ... Cannot allocate memory"),
      # crashing the database and Immich with it (2026-09-26). Immich's docs
      # also require a local filesystem for the database. The old folder
      # (immich-app/postgres) was left in place as a fallback copy.
      - immich-postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich
    restart: unless-stopped
    healthcheck:
      disable: false
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

volumes:
  immich-postgres:
    driver: local
  model-cache:
    driver: local

networks:
  immich:
    driver: bridge
    name: immich
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true
