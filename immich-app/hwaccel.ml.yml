# Configurations for hardware-accelerated machine learning

# If using Unraid or another platform that doesn't allow multiple Compose files,
# you can inline the config for a backend by copying its contents
# into the immich-machine-learning service in the docker-compose.yml file.

# See https://immich.app/docs/features/ml-hardware-acceleration for info on usage.

services:
  armnn:
    devices:
      - /dev/mali0:/dev/mali0
    volumes:
      - /lib/firmware/mali_csffw.bin:/lib/firmware/mali_csffw.bin:ro # Mali firmware for your chipset (not always required depending on the driver)
      - /usr/lib/libmali.so:/usr/lib/libmali.so:ro # Mali driver for your chipset (always required)
  
  rknn:
    security_opt:
      - systempaths=unconfined
      - apparmor=unconfined
    devices:
      - /dev/dri:/dev/dri

  cpu: {}

  cuda:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  rocm:
    group_add:
      - video
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd

  openvino:
    device_cgroup_rules:
      - 'c 189:* rmw'
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /dev/bus/usb:/dev/bus/usb

  openvino-wsl:
    devices:
      - /dev/dri:/dev/dri
      - /dev/dxg:/dev/dxg
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /usr/lib/wsl:/usr/lib/wsl

  # This repo's own addition (not upstream Immich) - _scripts/detect-gpu.ps1
  # picks this over plain openvino-wsl when it finds /dev/dxg but no
  # /dev/dri. Confirmed live on Docker Desktop's WSL2 backend (Windows 11,
  # current WSL2 kernel, up-to-date Intel Arc driver): /dev/dri does not
  # exist there at all, in either Docker Desktop's own WSL VM or a full
  # Ubuntu WSL distro with systemd-udevd running - this is a WSL2 platform
  # gap, not a missing driver, and the plain openvino-wsl profile above
  # fails to start without it. OpenVINO's GPU plugin works fine through
  # /dev/dxg alone though - verified with a real onnxruntime
  # OpenVINOExecutionProvider GPU session, no /dev/dri involved. Once
  # Microsoft exposes /dev/dri for WSL2 GPU passthrough (they've been
  # rolling this out gradually), detect-gpu.ps1 will pick openvino-wsl
  # instead automatically - this profile can retire whenever that lands
  # everywhere.
  openvino-wsl-dxgonly:
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl
