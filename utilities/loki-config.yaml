auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Keep 14 days of container logs, then delete - without this Loki keeps
  # everything forever. Enforced by the compactor below.
  retention_period: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# TSDB + schema v13 is the current recommended store (replaces the
# deprecated boltdb-shipper/v11 scheme used before Loki 3.x).
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# This is a privacy-focused homelab - don't phone home to Grafana Labs.
analytics:
  reporting_enabled: false
