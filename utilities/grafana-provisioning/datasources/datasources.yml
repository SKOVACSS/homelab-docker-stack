apiVersion: 1

# Prometheus and Loki were first provisioned without fixed UIDs; adding
# them to an existing data source makes Grafana fail to start ("data
# source not found" - confirmed live). Deleting by name first lets the
# definitions below recreate them cleanly with the new UIDs. Harmless on
# every later start (they're recreated identically) and on a fresh
# install (nothing to delete).
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    # Fixed UIDs so provisioned dashboards and alert rules can reference
    # these by ID (an auto-generated UID differs on every fresh install).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  # Reaches monitoring-stack's InfluxDB by joining monitoring-network
  # externally - see docker-compose.yml. INFLUXDB_ADMIN_TOKEN here must
  # match the same variable in monitoring-stack/.env.
  - name: InfluxDB
    uid: influxdb-v2
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: homelab
      defaultBucket: homelab
      httpMode: POST
    secureJsonData:
      token: ${INFLUXDB_ADMIN_TOKEN}
    editable: false
