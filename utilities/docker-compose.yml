networks:
  utilities:
    driver: bridge
    name: utilities
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true
  # Owned by monitoring-stack - joined here so Grafana can reach InfluxDB.
  # This means monitoring-stack must be deployed before utilities (already
  # the order _scripts/deploy.ps1 uses) - see TROUBLESHOOTING.md.
  monitoring-network:
    driver: bridge
    name: monitoring-network
    external: true

services:
  portainer:
    image: portainer/portainer-ce:2.45.1
    restart: unless-stopped
    ports:
      - "9001:9000"
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    networks:
      - utilities
      - caddy-network
    # Portainer has no PORTAINER_PASSWORD_HASHED environment variable (that
    # was never read by the binary - the real mechanism is the
    # --admin-password-file CLI flag). Simplest correct approach: leave it
    # unset and create the admin account through the web UI the first time
    # you open portainer.DOMAIN - Portainer prompts for this automatically
    # and locks the setup page after the first account is created.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # containrrr/watchtower was archived (Dec 2025, no more releases/security
  # fixes). nicholas-fedor/watchtower is the community continuation the
  # project's own discussion thread points to.
  watchtower:
    image: nickfedor/watchtower:1.22.2
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Auto-update settings
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_INCLUDE_RESTARTING=false
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_SCHEDULE=0 2 * * * *
      # Off by default. To get a Gotify notification whenever Watchtower
      # updates something: create an Application in Gotify's web UI, then
      # set GOTIFY_TOKEN in this stack's .env (see .env.example) - that
      # alone flips these on via the defaults below.
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS:-off}
      - WATCHTOWER_NOTIFICATION_URL=gotify://gotify:80/${GOTIFY_TOKEN:-}?disabletls=yes
      # Only update images with these labels
      - WATCHTOWER_LABEL_ENABLE=true
    networks:
      - utilities
      # To reach notification-stack's "gotify" service by container name.
      - caddy-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Diun - notifies about new image tags/digests without applying them.
  # Complements Watchtower rather than duplicating it: Watchtower only
  # re-triggers when the digest behind an already-pinned tag changes, so
  # for the many exact-pinned images in this repo (see CHANGELOG 1.0.7)
  # it never notices a genuinely new version tag being published upstream.
  # Diun's job is specifically that - watch every image for new tags, not
  # just changes to the one you already have pinned.
  diun:
    image: crazymax/diun:4.33.0
    restart: unless-stopped
    command: serve
    volumes:
      - diun-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 6 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      # Watch every container by default rather than requiring a
      # diun.enable=true label on ~40 services individually - this is
      # read-only/notify-only, so the lower-friction default is safe here
      # in a way it wasn't for Watchtower's actual auto-update behavior.
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      # Off by default, same pattern as Watchtower above: set GOTIFY_TOKEN
      # in this stack's .env to start getting notified.
      - DIUN_NOTIF_GOTIFY_ENDPOINT=http://gotify:80
      - DIUN_NOTIF_GOTIFY_TOKEN=${GOTIFY_TOKEN:-}
    networks:
      - utilities
      # To reach notification-stack's "gotify" service by container name.
      - caddy-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Uptime Kuma - Service monitoring
  # FIX APPLIED: external port changed 3001 -> 3002 to avoid conflict with Grafana (which uses 3000/3001 in some configs)
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - utilities
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Vaultwarden - Self-hosted Bitwarden password manager
  # FIX APPLIED: external port changed 80 -> 8077 to avoid conflict with Caddy reverse proxy
  vaultwarden:
    image: vaultwarden/server:1.37.3
    restart: unless-stopped
    ports:
      - "8077:80"
    volumes:
      - vaultwarden-data:/data
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      - INVITATIONS_ALLOWED=${VAULTWARDEN_INVITATIONS_ALLOWED:-true}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - LOG_LEVEL=warn
      - LOG_FILE=/data/vaultwarden.log
      # Security settings
      - EXTENDED_LOGGING=true
      - LOG_FILE_ENABLED=true
    networks:
      - utilities
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Loki - Centralized logging system
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - utilities
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/loki/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # node-exporter - host CPU/memory/disk/network metrics for Prometheus.
  # NOTE (Windows/macOS + Docker Desktop): `network_mode: host` and `pid: host`
  # only give true host visibility on native Linux, so this runs as a normal
  # container here - it will report the Docker Desktop Linux VM's resources,
  # not your real Windows host. On a native Linux/Synology deployment, add
  # `pid: host` and `network_mode: host` (dropping the `networks:` list
  # below) for accurate bare-metal numbers.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - utilities
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - utilities
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Grafana - Dashboards and visualizations. One instance for everything
  # (Prometheus, Loki, and InfluxDB via monitoring-network) rather than a
  # separate Grafana per data source - see CHANGELOG.md.
  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      # Read by grafana-provisioning/datasources/datasources.yml's InfluxDB
      # entry - must match monitoring-stack/.env's INFLUXDB_ADMIN_TOKEN.
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      # Read by grafana-provisioning/alerting/contact-points.yaml. Create
      # an Application in Gotify's web UI to get a token (the same one
      # Watchtower uses below is fine, or make a separate one).
      - GOTIFY_TOKEN=${GOTIFY_TOKEN:-}
    networks:
      - utilities
      - caddy-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  portainer-data:
    driver: local
  diun-data:
    driver: local
  uptime-kuma-data:
    driver: local
  vaultwarden-data:
    driver: local
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
