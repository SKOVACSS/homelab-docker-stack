networks:
  utilities:
    driver: bridge
    name: utilities
  caddy-network:
    driver: bridge
    name: caddy-network
    external: true
  # Owned by monitoring-stack - joined here so Grafana can reach InfluxDB.
  # This means monitoring-stack must be deployed before utilities (already
  # the order _scripts/deploy.ps1 uses) - see TROUBLESHOOTING.md.
  monitoring-network:
    driver: bridge
    name: monitoring-network
    external: true

services:
  portainer:
    image: portainer/portainer-ce:2.45.1
    restart: unless-stopped
    container_name: portainer
    # No published ports: the web UI is reachable only via Caddy's
    # portainer.{$DOMAIN} route, same firewall model as every other admin
    # UI - a security audit found this had been left directly published
    # alongside that route the whole time. 8000 was Portainer's Edge Agent
    # tunnel port, unused since this repo doesn't use Edge Agents (a
    # single-host setup manages its own Docker socket directly).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    networks:
      - utilities
      - caddy-network
    # Portainer has no PORTAINER_PASSWORD_HASHED environment variable (that
    # was never read by the binary - the real mechanism is the
    # --admin-password-file CLI flag). Simplest correct approach: leave it
    # unset and create the admin account through the web UI the first time
    # you open portainer.DOMAIN - Portainer prompts for this automatically
    # and locks the setup page after the first account is created.
    healthcheck:
      # No healthcheck: this image ships no shell, curl, or wget at all
      # (confirmed live - "exec: \"curl\": executable file not found") -
      # Portainer's own image has been effectively distroless for a while
      # now. Docker's own container-running state (no crash-loop) is the
      # only signal available; rely on that instead of a perpetually
      # "unhealthy" false negative.
      disable: true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # containrrr/watchtower was archived (Dec 2025, no more releases/security
  # fixes). nicholas-fedor/watchtower is the community continuation the
  # project's own discussion thread points to.
  watchtower:
    image: nickfedor/watchtower:1.22.2
    restart: unless-stopped
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Auto-update settings
      - WATCHTOWER_CLEANUP=true
      # Include stopped containers so Sablier-managed ones (vllm,
      # open-webui, jellyfin - asleep most of the time) still get
      # updated; REVIVE_STOPPED=false recreates them without starting
      # them, leaving the next request to wake them as usual.
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
      - WATCHTOWER_INCLUDE_RESTARTING=false
      # 6-field cron, SECONDS first: 0s 0m 8h = 08:00 daily in the container's
      # TZ (UTC unless TZ is set in .env) = 4 AM Eastern. It used to
      # be "0 2 * * * *", which is minute 2 of EVERY hour (confirmed live:
      # "next run in 51 minutes"), so updates could restart services in
      # the middle of the day. This keeps clear of the 2 AM backup, which
      # tars volumes while containers run. (POLL_INTERVAL is ignored when
      # a schedule is set, so it's gone.)
      - WATCHTOWER_SCHEDULE=0 0 8 * * *
      - TZ=${TZ:-UTC}
      # Off by default. To get a Gotify notification whenever Watchtower
      # updates something: create an Application in Gotify's web UI, then
      # set GOTIFY_TOKEN in this stack's .env (see .env.example) - that
      # alone is enough, since WATCHTOWER_NOTIFICATION_URL's presence is
      # what turns notifications on, not a separate toggle.
      #
      # Deliberately no WATCHTOWER_NOTIFICATIONS here: that flag is
      # deprecated and only accepts a fixed set of legacy type names
      # (email/slack/msteams/gotify) - "off" is not one of them and made
      # this container fatally exit on every single startup ("Unknown
      # notification type ... type=off"), confirmed live. Leaving it unset
      # entirely (not even blank) is the actual "notifications off" state;
      # WATCHTOWER_NOTIFICATION_URL alone correctly auto-detects the
      # gotify:// scheme when GOTIFY_TOKEN is set, confirmed live too.
      - WATCHTOWER_NOTIFICATION_URL=gotify://gotify:80/${GOTIFY_TOKEN:-}?disabletls=yes
      # Only update images with these labels
      - WATCHTOWER_LABEL_ENABLE=true
    networks:
      - utilities
      # To reach notification-stack's "gotify" service by container name.
      - caddy-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Diun - notifies about new image tags/digests without applying them.
  # Complements Watchtower rather than duplicating it: Watchtower only
  # re-triggers when the digest behind an already-pinned tag changes, so
  # for the many exact-pinned images in this repo (see CHANGELOG 1.0.7)
  # it never notices a genuinely new version tag being published upstream.
  # Diun's job is specifically that - watch every image for new tags, not
  # just changes to the one you already have pinned.
  diun:
    image: crazymax/diun:4.33.0
    restart: unless-stopped
    container_name: diun
    command: serve
    volumes:
      - diun-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 6 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      # Watch every container by default rather than requiring a
      # diun.enable=true label on ~40 services individually - this is
      # read-only/notify-only, so the lower-friction default is safe here
      # in a way it wasn't for Watchtower's actual auto-update behavior.
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      # Off by default, same pattern as Watchtower above: set GOTIFY_TOKEN
      # in this stack's .env to start getting notified.
      - DIUN_NOTIF_GOTIFY_ENDPOINT=http://gotify:80
      - DIUN_NOTIF_GOTIFY_TOKEN=${GOTIFY_TOKEN:-}
    networks:
      - utilities
      # To reach notification-stack's "gotify" service by container name.
      - caddy-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Uptime Kuma - Service monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    restart: unless-stopped
    container_name: uptime-kuma
    # No published port: reachable only via Caddy's uptime.{$DOMAIN}
    # route - a security audit found this directly published too, the
    # same pattern already fixed elsewhere. The old 3001->3002 host-port
    # remap (to dodge a collision with Grafana) is moot now that nothing
    # publishes this port at all.
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - utilities
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # AutoKuma - keeps Uptime Kuma's monitors in sync with files in this
  # repo (autokuma/monitors/*.json, one file per monitor), so a fresh
  # deploy gets every monitor and the Gotify alert automatically instead
  # of clicking them together in the UI - Kuma sat with zero monitors
  # before this. Checks use internal container URLs, so no domain name
  # ever lands in the repo. See autokuma/README.md to add one.
  #
  # Needs the Uptime Kuma admin login you created on first visit - set
  # UPTIME_KUMA_USERNAME and UPTIME_KUMA_PASSWORD in this stack's .env.
  # The Gotify notification is defined by the labels below, with the
  # token interpolated from .env (GOTIFY_TOKEN, same one Watchtower uses)
  # so it never lands in a committed file either.
  autokuma:
    image: ghcr.io/bigboot/autokuma:2.0.0
    restart: unless-stopped
    container_name: autokuma
    environment:
      - AUTOKUMA__KUMA__URL=http://uptime-kuma:3001
      - AUTOKUMA__KUMA__USERNAME=${UPTIME_KUMA_USERNAME:-}
      - AUTOKUMA__KUMA__PASSWORD=${UPTIME_KUMA_PASSWORD:-}
      - AUTOKUMA__STATIC_MONITORS=/autokuma/monitors
      # Default is every 5s. AutoKuma 2.0.0 re-saves the Gotify
      # notification on EVERY sync - Uptime Kuma v2 returns it with extra
      # fields (plus a nested copy of itself), so the comparison never
      # matches (notification support is "experimental" upstream, issue
      # #81). Harmless, but at 5s that was ~17,000 writes/day; 5 minutes
      # makes it negligible and monitor file changes still apply quickly.
      - AUTOKUMA__SYNC_INTERVAL=300
    volumes:
      - ./autokuma/monitors:/autokuma/monitors:ro
      # Read-only: AutoKuma only reads container labels (the notification
      # below is defined on this container's own labels).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - autokuma-data:/data
    networks:
      - utilities
    depends_on:
      - uptime-kuma
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kuma.gotify.notification.name=Gotify"
      - 'kuma.gotify.notification.config={"type": "gotify", "gotifyserverurl": "http://gotify:80", "gotifyapplicationToken": "${GOTIFY_TOKEN:-}", "gotifyPriority": 8}'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Vaultwarden - Self-hosted Bitwarden password manager
  vaultwarden:
    image: vaultwarden/server:1.37.3
    restart: unless-stopped
    container_name: vaultwarden
    # No published port: reachable only via Caddy's vault.{$DOMAIN} route -
    # a security audit found this directly published too, the same
    # pattern already fixed elsewhere (this is a password manager; there's
    # no service where bypassing TLS/rate-limiting matters more). The old
    # 80->8077 host-port remap is moot now that nothing publishes it.
    volumes:
      - vaultwarden-data:/data
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      - INVITATIONS_ALLOWED=${VAULTWARDEN_INVITATIONS_ALLOWED:-true}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - LOG_LEVEL=warn
      - LOG_FILE=/data/vaultwarden.log
      # Security settings
      - EXTENDED_LOGGING=true
      - LOG_FILE_ENABLED=true
    networks:
      - utilities
      - caddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Grafana Alloy - ships every container's logs to Loki (see
  # alloy/config.alloy). Before this Loki had no log shipper at all, so it
  # sat empty. Read-only Docker socket: it only lists containers and
  # tails their logs.
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    container_name: alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - utilities
    depends_on:
      - loki
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Loki - Centralized logging system
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    container_name: loki
    # No published port: has no Caddy route at all and isn't meant to -
    # it's a pure backend data source Grafana queries internally over the
    # utilities network. A security audit found it published to the host
    # anyway, serving no purpose but exposure.
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - utilities
    healthcheck:
      # No healthcheck: this image ships no shell, curl, or wget at all
      # (confirmed live - "exec: \"curl\": executable file not found") -
      # its own `loki` binary works fine when invoked directly (e.g.
      # `loki -version`), but has no self-check subcommand to exec as a
      # healthcheck either. Docker's own container-running state (no
      # crash-loop) is the only signal available; rely on that instead of
      # a perpetually "unhealthy" false negative.
      disable: true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # node-exporter - host CPU/memory/disk/network metrics for Prometheus.
  # NOTE (Windows/macOS + Docker Desktop): `network_mode: host` and `pid: host`
  # only give true host visibility on native Linux, so this runs as a normal
  # container here - it will report the Docker Desktop Linux VM's resources,
  # not your real Windows host. On a native Linux/Synology deployment, add
  # `pid: host` and `network_mode: host` (dropping the `networks:` list
  # below) for accurate bare-metal numbers.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - utilities
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    container_name: prometheus
    # No published port - same as Loki above: a pure backend data source
    # for Grafana, no Caddy route, no reason to be reachable from the host.
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - utilities
      # To scrape Caddy's internal metrics listener (caddy:9180).
      - caddy-network
    healthcheck:
      # Not curl (this image doesn't ship it, confirmed live) and not
      # "localhost" (resolves to ::1 in some of these minimal images,
      # which nothing listens on - seen with the same pattern elsewhere in
      # this repo) - wget is bundled here, and 127.0.0.1 avoids the IPv6
      # trap regardless of whether it'd actually bite on this image.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Grafana - Dashboards and visualizations. One instance for everything
  # (Prometheus, Loki, and InfluxDB via monitoring-network) rather than a
  # separate Grafana per data source - see CHANGELOG.md.
  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    container_name: grafana
    # No published port: reachable only via Caddy's grafana.{$DOMAIN}
    # route - a security audit found this directly published too, the
    # same pattern already fixed elsewhere.
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      # "Sign in with Authentik" - the provider/application on Authentik's
      # side is authentik/blueprints/grafana.yaml. Members of Authentik's
      # "authentik Admins" group become Grafana Admins; everyone else gets
      # read-only Viewer. The local admin login keeps working as a
      # fallback if Authentik is ever down. auth.DOMAIN resolves straight
      # to Caddy inside Docker (caddy-network alias), so the token
      # exchange doesn't round-trip through Cloudflare.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${GRAFANA_OIDC_ENABLED:-false}
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:-}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email offline_access
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.${DOMAIN}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.${DOMAIN}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.${DOMAIN}/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.${DOMAIN}/application/o/grafana/end-session/
      # Read by grafana-provisioning/datasources/datasources.yml's InfluxDB
      # entry - must match monitoring-stack/.env's INFLUXDB_ADMIN_TOKEN.
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      # Read by grafana-provisioning/alerting/contact-points.yaml. Create
      # an Application in Gotify's web UI to get a token (the same one
      # Watchtower uses below is fine, or make a separate one).
      - GOTIFY_TOKEN=${GOTIFY_TOKEN:-}
    networks:
      - utilities
      - caddy-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Scrutiny - SMART health and failure prediction for every physical
  # drive (scrutiny.{$DOMAIN}, admin wall). Docker Desktop's VM can't see
  # the real disks, so the collector runs on Windows itself
  # (_scripts/install-scrutiny-collector.ps1, as Administrator) and posts
  # results here through the localhost-only port below. Failing or
  # degrading drives are pushed to Gotify.
  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.9.4-omnibus
    restart: unless-stopped
    container_name: scrutiny
    environment:
      - TZ=${TZ:-UTC}
      # shoutrrr format; Gotify is on caddy-network (plain http inside).
      - SCRUTINY_NOTIFY_URLS=gotify://gotify:80/${GOTIFY_TOKEN}?disabletls=yes
    volumes:
      - scrutiny-config:/opt/scrutiny/config
      - scrutiny-influxdb:/opt/scrutiny/influxdb
    # 127.0.0.1 only: for the Windows collector, not the LAN.
    ports:
      - "127.0.0.1:8089:8080"
    networks:
      - utilities
      - caddy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Speedtest Tracker - scheduled Starlink speed tests with history
  # (speedtest.{$DOMAIN}, admin wall + its own login from .env). Every 3
  # hours: each test moves a few hundred MB, so keep it sparse.
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.15.0
    restart: unless-stopped
    container_name: speedtest-tracker
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      # Times shown in the UI. The container itself stays on UTC like the
      # rest of utilities (see watchtower's schedule note above).
      - DISPLAY_TIMEZONE=${SPEEDTEST_DISPLAY_TZ:-UTC}
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=https://speedtest.${DOMAIN}
      - ASSET_URL=https://speedtest.${DOMAIN}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=15 */3 * * *
      - PRUNE_RESULTS_OLDER_THAN=365
      # Charts viewable without Speedtest's own login - the site is already
      # behind the Authentik admin wall. Settings still need the login.
      - PUBLIC_DASHBOARD=true
      - ADMIN_NAME=Admin
      - ADMIN_EMAIL=${SPEEDTEST_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${SPEEDTEST_ADMIN_PASSWORD}
    volumes:
      - speedtest-config:/config
    networks:
      - utilities
      - caddy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:80/api/healthcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  portainer-data:
    driver: local
  diun-data:
    driver: local
  uptime-kuma-data:
    driver: local
  vaultwarden-data:
    driver: local
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alloy-data:
    driver: local
  autokuma-data:
    driver: local
  scrutiny-config:
    driver: local
  scrutiny-influxdb:
    driver: local
  speedtest-config:
    driver: local
