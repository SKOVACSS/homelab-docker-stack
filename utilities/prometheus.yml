global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Caddy serves metrics on an internal-only :9180 listener (see the
  # Caddyfile) - never the admin API on :2019, which can reconfigure
  # Caddy and stays bound to localhost. Reached over caddy-network.
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:9180']
    metrics_path: '/metrics'

  # To scrape the Docker daemon's own metrics, enable them first:
  # add {"metrics-addr": "0.0.0.0:9323", "experimental": true} to
  # daemon.json, then uncomment this job.
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['host.docker.internal:9323']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # The Windows host itself (node-exporter above only sees Docker's WSL2
  # VM): real CPU, RAM, every drive, NICs, services. windows_exporter runs
  # as a Windows service - install with
  #   winget install --id Prometheus.WindowsExporter --exact
  # Scrape time of a few seconds is normal for the service collector.
  - job_name: 'windows'
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ['host.docker.internal:9182']
        labels:
          instance: 'server'
