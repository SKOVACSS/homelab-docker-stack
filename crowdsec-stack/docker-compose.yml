# CrowdSec Stack - optional. Off by default, same pattern as email-stack:
# no .env here means deploy.ps1 skips this stack entirely, nothing starts.
# Run _scripts/enable-crowdsec.ps1 to turn it on - see that script and
# SETUP.md for why this needs more manual, sequential setup in your
# actual Cloudflare account than any other optional stack in this repo
# (a broad-permission Cloudflare API token has to be created first). The
# cloudflare-bouncer service below runs in CrowdSec's "Daemon Mode" - it
# deploys its own Cloudflare Worker, KV namespace, and Worker Routes on
# startup using that token, and tears them down again on a clean stop.
# No separate GitHub-based installer needed or wanted - that's a
# different, alternative CrowdSec setup path this repo doesn't use.
#
# Why this exists: Fail2Ban (security-stack/) is real, but its ban
# action can't reach the real Windows host's network stack under Docker
# Desktop - see TROUBLESHOOTING.md. This stack's cloudflare-bouncer bans
# at Cloudflare's edge via their API instead of local iptables, which
# isn't subject to that limitation at all - it can actually block an
# attacker on this host, today.
#
# crowdsec (the engine) has no such limitation - it's just log parsing
# and decision-making, no host network access needed - so it's useful on
# its own even without ever setting up the Cloudflare bouncer half, if
# you just want CrowdSec's community threat-intel enrichment and a nicer
# detection engine than Fail2Ban's regex-only approach.

networks:
  crowdsec-network:
    driver: bridge
    name: crowdsec-network

volumes:
  crowdsec-config:
    driver: local
  crowdsec-data:
    driver: local
  # Caddy's own access-log volume, shared read-only - same volume, same
  # reasoning as security-stack/fail2ban's caddy jail (see
  # security-stack/docker-compose.yml's comment on this). Referenced by
  # its actual live name (`docker volume ls`), which docker compose
  # auto-generates as <project-name>_<volume-name> since
  # caddy/docker-compose.yml doesn't pin an explicit `name:` for it.
  caddy_caddy-data:
    external: true

services:
  # ========== CROWDSEC: Detection Engine ==========
  crowdsec:
    # slim: no notification plugins, no bundled GeoIP database - neither
    # is used here (Gotify notifications aren't wired up for this, and
    # nothing in the caddy collection's scenarios needs GeoIP lookups).
    image: crowdsecurity/crowdsec:slim
    restart: unless-stopped
    container_name: crowdsec
    environment:
      - TZ=${TZ:-UTC}
      # Auto-installed on first boot - parser + generic HTTP attack
      # scenarios for Caddy's log format specifically. See
      # acquis.d/caddy.yaml for what feeds it.
      - COLLECTIONS=crowdsecurity/caddy
    volumes:
      # Credentials/hub state and the ban decision database respectively -
      # both need to survive a container recreate/image update, per
      # CrowdSec's own documented requirement (refuses to start at all
      # since v1.7.0 if the data dir isn't a real volume).
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - ./acquis.d:/etc/crowdsec/acquis.d:ro
      - caddy_caddy-data:/caddy-logs:ro
      # Custom scenario the stock crowdsecurity/caddy collection doesn't
      # cover - see scenarios/caddy-generic-auth-fail.yaml for why.
      - ./scenarios/caddy-generic-auth-fail.yaml:/etc/crowdsec/scenarios/caddy-generic-auth-fail.yaml:ro
      # Exempts specific apps' own known-legitimate-but-bursty traffic
      # from scenario detection entirely - see
      # whitelists/homelab-known-apps.yaml for why.
      - ./whitelists/homelab-known-apps.yaml:/etc/crowdsec/parsers/s02-enrich/homelab-known-apps.yaml:ro
    networks:
      - crowdsec-network
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ========== CLOUDFLARE BOUNCER: Actual Enforcement ==========
  # Pushes crowdsec's decisions to the Cloudflare Worker/KV setup deployed
  # via SETUP.md's manual steps - this is what actually bans, at
  # Cloudflare's edge, not this host. Needs cloudflare-bouncer.yaml (real
  # config, gitignored - see cloudflare-bouncer.yaml.example) generated
  # by enable-crowdsec.ps1, which requires the crowdsec engine above to
  # already be running (its LAPI issues this bouncer's API key).
  cloudflare-bouncer:
    image: crowdsecurity/cloudflare-worker-bouncer
    restart: unless-stopped
    container_name: crowdsec-cloudflare-bouncer
    depends_on:
      crowdsec:
        condition: service_healthy
    volumes:
      - ./cloudflare-bouncer.yaml:/etc/crowdsec/bouncers/crowdsec-cloudflare-worker-bouncer.yaml:ro
    networks:
      - crowdsec-network
    # Prometheus metrics must be enabled in cloudflare-bouncer.yaml
    # (prometheus.enabled: true, port 2112) for this to work - it's a
    # functional check (the HTTP server actually responds), not just a
    # "did the process exit" check, matching crowdsec's own healthcheck
    # above. Not published to the host - checked from inside the
    # container's own network namespace only.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2112/metrics"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
