# CrowdSec Stack - optional. Off by default, same pattern as email-stack:
# no .env here means deploy.ps1 skips this stack entirely, nothing starts.
# Run _scripts/enable-crowdsec.ps1 to turn it on.
#
# Why this exists: Fail2Ban (security-stack/) is real, but its ban
# action can't reach the real Windows host's network stack under Docker
# Desktop - see TROUBLESHOOTING.md. Enforcement here happens inside
# Caddy instead (caddy-crowdsec-bouncer, compiled into caddy/Dockerfile),
# which sees the real client IP via trusted_proxies and needs no host
# network access at all - it can actually block an attacker on this host.
#
# This used to enforce at Cloudflare's edge via the cloudflare-worker-
# bouncer (a Worker + KV namespace). Retired: the free Workers KV quota
# (1000 writes/day) ran out within seconds of a normal decision sync,
# and its Daemon Mode redeploys the Worker on every restart - which
# needs a KV write, so after quota exhaustion it crash-looped until the
# UTC reset. The Caddy bouncer keeps decisions in memory, has no quota,
# and can use CrowdSec's full community blocklist too.

networks:
  crowdsec-network:
    driver: bridge
    name: crowdsec-network
  # Owned by the caddy stack - see media-stack's same external reference.
  caddy-network:
    name: caddy-network
    external: true

volumes:
  crowdsec-config:
    driver: local
  crowdsec-data:
    driver: local
  # Caddy's own access-log volume, shared read-only - same volume, same
  # reasoning as security-stack/fail2ban's caddy jail (see
  # security-stack/docker-compose.yml's comment on this). Referenced by
  # its actual live name (`docker volume ls`), which docker compose
  # auto-generates as <project-name>_<volume-name> since
  # caddy/docker-compose.yml doesn't pin an explicit `name:` for it.
  caddy_caddy-data:
    external: true

services:
  # ========== CROWDSEC: Detection Engine ==========
  crowdsec:
    # slim: no notification plugins, no bundled GeoIP database - neither
    # is used here (Gotify notifications aren't wired up for this, and
    # nothing in the caddy collection's scenarios needs GeoIP lookups).
    image: crowdsecurity/crowdsec:slim
    restart: unless-stopped
    container_name: crowdsec
    environment:
      - TZ=${TZ:-UTC}
      # Auto-installed on first boot - parser + generic HTTP attack
      # scenarios for Caddy's log format specifically. See
      # acquis.d/caddy.yaml for what feeds it.
      - COLLECTIONS=crowdsecurity/caddy
    volumes:
      # Credentials/hub state and the ban decision database respectively -
      # both need to survive a container recreate/image update, per
      # CrowdSec's own documented requirement (refuses to start at all
      # since v1.7.0 if the data dir isn't a real volume).
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - ./acquis.d:/etc/crowdsec/acquis.d:ro
      - caddy_caddy-data:/caddy-logs:ro
      # Custom scenario the stock crowdsecurity/caddy collection doesn't
      # cover - see scenarios/caddy-generic-auth-fail.yaml for why.
      - ./scenarios/caddy-generic-auth-fail.yaml:/etc/crowdsec/scenarios/caddy-generic-auth-fail.yaml:ro
      # Exempts specific apps' own known-legitimate-but-bursty traffic
      # from scenario detection entirely - see
      # whitelists/homelab-known-apps.yaml for why.
      - ./whitelists/homelab-known-apps.yaml:/etc/crowdsec/parsers/s02-enrich/homelab-known-apps.yaml:ro
    networks:
      - crowdsec-network
      # So Caddy's built-in bouncer can reach this LAPI at
      # http://crowdsec:8080 (see caddy/crowdsec.d/).
      - caddy-network
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ========== HOUSEHOLD ALLOWLIST: never ban ourselves ==========
  # Keeps the home connection's current (dynamic) public IP on a CrowdSec
  # allowlist - see household-allowlist.sh for why and the tradeoff.
  # Shares crowdsec's network namespace so cscli reaches the LAPI on
  # localhost with crowdsec's own credentials (config mounted read-only).
  # The data volume is needed too: cscli reads allowlists via the LAPI
  # but writes them straight to the database - confirmed live, without
  # it `allowlists add` silently wrote to a throwaway DB in this
  # container and the real allowlist stayed empty.
  household-allowlist:
    image: crowdsecurity/crowdsec:slim
    restart: unless-stopped
    container_name: crowdsec-household-allowlist
    entrypoint: ["/bin/sh", "/household-allowlist.sh"]
    network_mode: "service:crowdsec"
    depends_on:
      crowdsec:
        condition: service_healthy
    volumes:
      - crowdsec-config:/etc/crowdsec:ro
      - crowdsec-data:/var/lib/crowdsec/data
      - ./household-allowlist.sh:/household-allowlist.sh:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

